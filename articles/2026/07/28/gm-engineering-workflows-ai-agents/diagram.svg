<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f8f9fa" rx="10"/>
  
  <text x="400" y="40" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">GM Agent Control Plane Архитектура</text>
  
  <!-- Engineer -->
  <g transform="translate(50, 200)">
    <circle cx="50" cy="40" r="30" fill="#4dabf7"/>
    <rect x="30" y="75" width="40" height="50" rx="5" fill="#4dabf7"/>
    <text x="50" y="150" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Инженер</text>
  </g>
  
  <!-- Agent Control Plane -->
  <rect x="250" y="120" width="300" height="260" rx="10" fill="#e7f5ff" stroke="#339af0" stroke-width="3"/>
  <text x="400" y="160" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1864ab">Agent Control Plane</text>
  
  <rect x="280" y="190" width="240" height="50" rx="5" fill="#fff" stroke="#74c0fc" stroke-width="2"/>
  <text x="400" y="222" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1864ab">Библиотека с умения (Skills)</text>
  
  <rect x="280" y="270" width="240" height="50" rx="5" fill="#fff" stroke="#74c0fc" stroke-width="2"/>
  <text x="400" y="302" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1864ab">Агенти за логика (M2M)</text>
  
  <!-- MCP Servers -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#d3f9d8" stroke="#51cf66" stroke-width="2"/>
    <text x="75" y="35" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2b8a3e">MCP сървъри</text>
    <text x="75" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2b8a3e">(Телеметрия &amp; APIs)</text>
  </g>
  
  <!-- WebViz / Data -->
  <g transform="translate(600, 220)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#ffdeeb" stroke="#f06595" stroke-width="2"/>
    <text x="75" y="35" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#a61e4d">WebViz &amp;</text>
    <text x="75" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#a61e4d">Петабайти данни</text>
  </g>
  
  <!-- Results -->
  <g transform="translate(600, 340)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
    <text x="75" y="35" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e67700">3x Увеличение</text>
    <text x="75" y="60" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#e67700">на Merged PRs</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 160 250 L 235 250" fill="none" stroke="#adb5bd" stroke-width="3" marker-end="url(#arrow)"/>
  
  <path d="M 550 140 L 585 140" fill="none" stroke="#adb5bd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 585 140 L 550 140" fill="none" stroke="#adb5bd" stroke-width="3" marker-start="url(#arrow-start)"/>
  
  <path d="M 675 190 L 675 210" fill="none" stroke="#adb5bd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 675 210 L 675 190" fill="none" stroke="#adb5bd" stroke-width="3" marker-start="url(#arrow-start)"/>
  
  <path d="M 550 380 L 585 380" fill="none" stroke="#adb5bd" stroke-width="3" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#adb5bd"/>
    </marker>
  </defs>
</svg>
