<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#F8FAFC" rx="16"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Независима ИИ Архитектура за Бизнеса</text>
  <text x="400" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Препоръчителен модел за избягване на пълно аутсорсване на мисленето (по Сатя Надела)</text>
  
  <!-- Connections from App (Top) to Control Layers -->
  <path d="M 340 120 L 210 175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 120 L 400 175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 460 120 L 590 175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Horizontal Connections in Control Layer -->
  <path d="M 260 215 L 295 215" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 540 215 L 505 215" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Connection from AI Gateway to Metadata Retention -->
  <path d="M 400 250 L 400 295" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-gold)"/>
  
  <!-- Metadata Retention to Open-Weight Models (Training) -->
  <path d="M 450 360 L 520 405" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-gold)"/>
  
  <!-- AI Gateway to Commercial Models (routed to avoid Metadata box) -->
  <path d="M 330 250 L 330 270 L 230 270 L 230 405" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- AI Gateway to Open-Weight Models (routed to avoid Metadata box) -->
  <path d="M 470 250 L 470 270 L 570 270 L 570 405" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Top Node: Application -->
  <rect x="280" y="75" width="240" height="45" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="400" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Фирмено приложение / Dev</text>
  
  <!-- Control Layer Nodes -->
  <!-- Harness -->
  <rect x="60" y="180" width="200" height="70" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="160" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">Отделен Harness</text>
  <text x="160" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">(Интерфейси: Claude Code, Codex)</text>
  
  <!-- AI Gateway -->
  <rect x="300" y="180" width="200" height="70" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="400" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle" dominant-baseline="central">AI Gateway (ИИ Портал)</text>
  <text x="400" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#065F46" text-anchor="middle" dominant-baseline="central">(Управление на промптове &amp; трафик)</text>
  
  <!-- Context & Memory -->
  <rect x="540" y="180" width="200" height="70" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
  <text x="640" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#5B21B6" text-anchor="middle" dominant-baseline="central">Отделен Контекст &amp; Памет</text>
  <text x="640" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B21B6" text-anchor="middle" dominant-baseline="central">(Задържане на фирмената памет)</text>
  
  <!-- Metadata Retention -->
  <rect x="300" y="300" width="200" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle" dominant-baseline="central">Запазване на Метаданни</text>
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400E" text-anchor="middle" dominant-baseline="central">(За обучение на собствени тегла)</text>
  <text x="500" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle" dominant-baseline="central">обучение</text>
  
  <!-- Bottom Model Nodes -->
  <!-- Commercial Models -->
  <rect x="60" y="410" width="310" height="60" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2"/>
  <text x="215" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9F1239" text-anchor="middle" dominant-baseline="central">Външни ИИ лаборатории (комерсиални)</text>
  <text x="215" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9F1239" text-anchor="middle" dominant-baseline="central">(Заменяеми API: OpenAI, Anthropic)</text>
  
  <!-- Open-Weight Models -->
  <rect x="430" y="410" width="310" height="60" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="585" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#166534" text-anchor="middle" dominant-baseline="central">Отворени модели (собствени тегла)</text>
  <text x="585" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534" text-anchor="middle" dominant-baseline="central">(Llama, Gemma - на собствен хардуер)</text>
</svg>
