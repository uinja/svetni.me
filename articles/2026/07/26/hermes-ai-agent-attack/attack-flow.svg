<svg width="100%" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-primary)" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--color-secondary)" />
    </marker>
  </defs>
  <style>
    text {
      font-family: system-ui, -apple-system, sans-serif;
      fill: var(--color-on-surface);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      fill: var(--color-primary);
    }
    .box-title {
      font-size: 14px;
      font-weight: 600;
    }
    .box-desc {
      font-size: 11px;
      fill: var(--color-on-surface);
      opacity: 0.85;
    }
    .arrow-text {
      font-size: 11px;
      font-weight: 500;
      fill: var(--color-secondary);
    }
    rect.primary {
      fill: var(--color-primary);
      stroke: var(--color-primary);
      stroke-width: 2;
    }
    rect.surface {
      fill: var(--color-surface);
      stroke: var(--color-primary);
      stroke-width: 2;
    }
    text.on-primary {
      fill: var(--color-on-primary);
    }
  </style>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">Архитектура на автономната атака срещу МФ на Тайланд</text>

  <!-- Connectors (drawn behind nodes) -->
  <!-- Operator -> Staging Server -->
  <path d="M 280 110 H 432" fill="none" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Staging Server -> Hermes -->
  <path d="M 440 110 H 245 V 182" fill="none" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Staging Server -> Hades -->
  <path d="M 570 140 V 182" fill="none" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Hermes -> Intranet Components -->
  <path d="M 245 260 V 290 H 165 V 352" fill="none" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 245 260 V 290 H 400 V 352" fill="none" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 245 260 V 290 H 635 V 352" fill="none" stroke="var(--color-primary)" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Hades -> Intranet -->
  <path d="M 555 260 V 352" fill="none" stroke="var(--color-secondary)" stroke-width="2" marker-end="url(#arrow-secondary)" />

  <!-- Connector Texts -->
  <text x="360" y="98" class="arrow-text" text-anchor="middle">Качване на инструменти</text>
  <text x="565" y="285" class="arrow-text" fill="var(--color-secondary)">C2 канал за достъп</text>

  <!-- Nodes -->
  <!-- Operator Box -->
  <rect x="100" y="80" width="180" height="60" rx="8" class="primary" />
  <text x="190" y="105" class="box-title on-primary" text-anchor="middle">Оператор</text>
  <text x="190" y="125" class="box-desc on-primary" text-anchor="middle">Китайски езикови белези</text>

  <!-- Staging Server Box -->
  <rect x="440" y="80" width="260" height="60" rx="8" class="surface" />
  <text x="570" y="105" class="box-title" text-anchor="middle">Междинен сървър (C2)</text>
  <text x="570" y="125" class="box-desc" text-anchor="middle">43.246.208.207 (Хонконг)</text>

  <!-- Hermes AI Agent Box -->
  <rect x="120" y="190" width="250" height="70" rx="8" class="primary" />
  <text x="245" y="218" class="box-title on-primary" text-anchor="middle">Hermes AI Агент</text>
  <text x="245" y="238" class="box-desc on-primary" text-anchor="middle">Режим YOLO / Автономна работа</text>

  <!-- Hades Go-Implant Box -->
  <rect x="430" y="190" width="250" height="70" rx="8" class="surface" />
  <text x="555" y="218" class="box-title" text-anchor="middle">Hades Go-Имплант</text>
  <text x="555" y="238" class="box-desc" text-anchor="middle">Криптиран бекон (AES-256-GCM)</text>

  <!-- Ministry Intranet Container -->
  <rect x="40" y="310" width="720" height="160" rx="12" fill="none" stroke="var(--color-secondary)" stroke-width="2" stroke-dasharray="4 4" />
  <text x="60" y="335" class="box-title" fill="var(--color-secondary)">Вътрешна мрежа на МФ на Тайланд (MOF Intranet)</text>

  <!-- Hadoop Box -->
  <rect x="60" y="360" width="210" height="90" rx="6" class="surface" />
  <text x="165" y="385" class="box-title" text-anchor="middle">Apache Hadoop / Hive</text>
  <text x="165" y="408" class="box-desc" text-anchor="middle">Default credentials в HiveServer2</text>
  <text x="165" y="428" class="box-desc" text-anchor="middle">RCE чрез злонамерен Java UDF</text>

  <!-- GlassFish Box -->
  <rect x="295" y="360" width="210" height="90" rx="6" class="surface" />
  <text x="400" y="385" class="box-title" text-anchor="middle">GlassFish Server</text>
  <text x="400" y="408" class="box-desc" text-anchor="middle">Deploy на WAR уеб шелове</text>
  <text x="400" y="428" class="box-desc" text-anchor="middle">Качване на JSP задна врата</text>

  <!-- Privilege Escalation & Mail Box -->
  <rect x="530" y="360" width="210" height="90" rx="6" class="surface" />
  <text x="635" y="385" class="box-title" text-anchor="middle">Ескалация &amp; Пощи</text>
  <text x="635" y="408" class="box-desc" text-anchor="middle">Скрипт LinPEAS за сканиране</text>
  <text x="635" y="428" class="box-desc" text-anchor="middle">CVE-2021-3156 / CVE-2021-4034</text>
</svg>
