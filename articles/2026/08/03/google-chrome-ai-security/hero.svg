<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3460" />
      <stop offset="100%" stop-color="#e94560" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Connections -->
  <path d="M 200 200 L 400 120" stroke="#e94560" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.7"/>
  <path d="M 200 200 L 400 280" stroke="#e94560" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.7"/>
  <path d="M 400 120 L 600 200" stroke="#e94560" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.7"/>
  <path d="M 400 280 L 600 200" stroke="#e94560" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.7"/>

  <!-- Nodes -->
  <circle cx="200" cy="200" r="60" fill="url(#cardGradient)" stroke="#ffffff" stroke-width="3" />
  <text x="200" y="205" font-family="sans-serif" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Chrome</text>
  <text x="200" y="225" font-family="sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">1072 Bugs Fixed</text>

  <circle cx="400" cy="120" r="50" fill="#0f3460" stroke="#e94560" stroke-width="3" />
  <text x="400" y="125" font-family="sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="middle">Naptime</text>

  <circle cx="400" cy="280" r="50" fill="#0f3460" stroke="#e94560" stroke-width="3" />
  <text x="400" y="285" font-family="sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="middle">Big Sleep</text>

  <circle cx="600" cy="200" r="60" fill="url(#cardGradient)" stroke="#ffffff" stroke-width="3" />
  <text x="600" y="200" font-family="sans-serif" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Gemini</text>
  <text x="600" y="220" font-family="sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">CodeMender</text>

  <!-- Title -->
  <text x="400" y="40" font-family="sans-serif" font-size="24" fill="white" font-weight="bold" text-anchor="middle">Google AI Security Pipeline</text>
</svg>
