<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Central Card Glow -->
    <radialGradient id="card-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Connection Line Gradients -->
    <linearGradient id="left-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="right-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Copilot Swirl Colors -->
    <linearGradient id="copilot-swirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Background Grid/Stars -->
  <g opacity="0.1">
    <circle cx="100" cy="80" r="1" fill="#ffffff"/>
    <circle cx="250" cy="120" r="1.5" fill="#ffffff"/>
    <circle cx="700" cy="150" r="1" fill="#ffffff"/>
    <circle cx="650" cy="400" r="2" fill="#ffffff"/>
    <circle cx="150" cy="380" r="1" fill="#ffffff"/>
    <circle cx="450" cy="40" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="250" r="300" fill="url(#bg-glow)"/>
  <circle cx="400" cy="250" r="180" fill="url(#card-glow)"/>

  <!-- Left Side Flow Paths (Merging) -->
  <path d="M 200,165 C 250,165 240,250 280,250" fill="none" stroke="url(#left-flow)" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 200,315 C 250,315 240,250 280,250" fill="none" stroke="url(#left-flow)" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Right Side Flow Paths (Branching) -->
  <path d="M 520,250 C 560,250 550,130 600,130" fill="none" stroke="url(#right-flow)" stroke-width="3"/>
  <path d="M 520,250 C 560,250 550,240 600,240" fill="none" stroke="url(#right-flow)" stroke-width="3"/>
  <path d="M 520,250 C 560,250 550,350 600,350" fill="none" stroke="url(#right-flow)" stroke-width="3"/>

  <!-- LEFT CARDS (Source Feeds) -->
  
  <!-- Personal Copilot Card -->
  <g transform="translate(60, 120)">
    <rect width="140" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Personal User Icon (Avatar Circle + Body) -->
    <circle cx="35" cy="45" r="14" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="35" cy="41" r="5" fill="#3b82f6"/>
    <path d="M 27,51 C 27,47 31,47 35,47 C 39,47 43,47 43,51" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <!-- Chat Lines Representation -->
    <rect x="65" y="35" width="50" height="6" rx="3" fill="#475569"/>
    <rect x="65" y="47" width="35" height="6" rx="3" fill="#475569"/>
  </g>

  <!-- Work Copilot Card -->
  <g transform="translate(60, 270)">
    <rect width="140" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Enterprise/Work Icon (Briefcase) -->
    <rect x="23" y="36" width="24" height="18" rx="3" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 29,36 L 29,32 C 29,30 31,29 33,29 L 37,29 C 39,29 41,30 41,32 L 41,36" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="23" y1="43" x2="47" y2="43" stroke="#10b981" stroke-width="2"/>
    <!-- Document Lines Representation -->
    <rect x="65" y="38" width="50" height="6" rx="3" fill="#475569"/>
    <rect x="65" y="50" width="42" height="6" rx="3" fill="#475569"/>
  </g>

  <!-- CENTER CARD: The Unified Copilot Application -->
  <g transform="translate(280, 80)">
    <!-- Base Card Shadow/Border -->
    <rect width="240" height="340" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect width="240" height="34" rx="0" fill="#0f172a" opacity="0.5" clip-path="polygon(0 0, 240 0, 240 34, 0 34)"/>
    <!-- Simulated App Controls -->
    <circle cx="20" cy="17" r="4" fill="#ef4444"/>
    <circle cx="32" cy="17" r="4" fill="#f59e0b"/>
    <circle cx="44" cy="17" r="4" fill="#10b981"/>
    
    <!-- Top Search/AI Prompt Bar -->
    <rect x="20" y="52" width="200" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="66" r="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <line x1="38" y1="69" x2="43" y2="74" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Central Copilot Swirl Emblem -->
    <g transform="translate(120, 150) scale(0.95)">
      <!-- Outer Swirl Path (Curved ribbon loop) -->
      <path d="M -30,-20 C -10,-40 30,-40 40,-10 C 50,20 10,40 -20,20 C -40,10 -40,-20 -10,-35 C 10,-45 40,-10 20,20 C 10,30 -20,30 -30,0" 
            fill="none" stroke="url(#copilot-swirl)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Simulated UI Content: Chats & Images -->
    <!-- Message 1 (Incoming User Prompt) -->
    <rect x="20" y="215" width="130" height="24" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="32" y="224" width="80" height="6" rx="3" fill="#60a5fa"/>

    <!-- Message 2 (AI Response Content) -->
    <rect x="50" y="248" width="170" height="42" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
    <rect x="62" y="258" width="130" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="62" y="268" width="145" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="62" y="278" width="90" height="5" rx="2.5" fill="#94a3b8"/>

    <!-- Image Output Integration Grid -->
    <rect x="20" y="299" width="95" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="30" y="308" width="55" height="6" rx="3" fill="#34d399"/>
    
    <rect x="125" y="299" width="95" height="24" rx="6" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="135" y="308" width="55" height="6" rx="3" fill="#fb7185"/>
  </g>

  <!-- RIGHT CARDS (Target Integrations) -->

  <!-- Card 3: Microsoft 365 Apps -->
  <g transform="translate(600, 90)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Word-like Document Icon -->
    <rect x="25" y="25" width="20" height="26" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="30" y1="31" x2="40" y2="31" stroke="#2563eb" stroke-width="2"/>
    <line x1="30" y1="37" x2="40" y2="37" stroke="#2563eb" stroke-width="2"/>
    <line x1="30" y1="43" x2="36" y2="43" stroke="#2563eb" stroke-width="2"/>
    <!-- Integration Lines -->
    <rect x="58" y="32" width="60" height="5" rx="2.5" fill="#475569"/>
    <rect x="58" y="42" width="45" height="5" rx="2.5" fill="#475569"/>
  </g>

  <!-- Card 4: Image Creation (Designer) -->
  <g transform="translate(600, 200)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Paintbrush/Palette Art representation -->
    <circle cx="35" cy="40" r="14" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="31" cy="34" r="2.5" fill="#ef4444"/>
    <circle cx="39" cy="34" r="2.5" fill="#3b82f6"/>
    <circle cx="39" cy="44" r="2.5" fill="#eab308"/>
    <!-- Integration Lines -->
    <rect x="58" y="32" width="60" height="5" rx="2.5" fill="#475569"/>
    <rect x="58" y="42" width="50" height="5" rx="2.5" fill="#475569"/>
  </g>

  <!-- Card 5: Cloud Files (OneDrive) -->
  <g transform="translate(600, 310)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Cloud Icon -->
    <path d="M 28,45 C 25,45 22,42 22,39 C 22,36 24,33 27,33 C 28,30 31,27 35,27 C 39,27 42,30 43,33 C 46,33 48,35 48,38 C 48,42 45,45 42,45 Z" 
          fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>
    <!-- Integration Lines -->
    <rect x="58" y="32" width="60" height="5" rx="2.5" fill="#475569"/>
    <rect x="58" y="42" width="40" height="5" rx="2.5" fill="#475569"/>
  </g>

  <!-- Flow Particle indicators (representing active consolidation) -->
  <circle cx="230" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="255" cy="275" r="4" fill="#818cf8"/>
  <circle cx="545" cy="210" r="4" fill="#a78bfa"/>
  <circle cx="570" cy="320" r="4" fill="#ec4899"/>
</svg>
