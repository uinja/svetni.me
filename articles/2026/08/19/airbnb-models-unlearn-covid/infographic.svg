<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <!-- Background -->
  <rect width="800" height="500" fill="#FAF8F5" rx="16" />
  
  <g font-family="system-ui, sans-serif">
    <!-- Header Section -->
    <text x="400" y="45" font-size="22" font-weight="bold" fill="#2E2B2A" text-anchor="middle" dominant-baseline="central">FORECASTING DECISION MATRIX</text>
    <text x="400" y="75" font-size="14" fill="#6E6865" text-anchor="middle" dominant-baseline="central">Selecting the right action when production model predictions begin to drift</text>
    
    <!-- CARD 1: REFIT -->
    <g transform="translate(40, 110)">
      <rect width="210" height="340" fill="#EBF3FB" rx="12" stroke="#C6DCF3" stroke-width="2" />
      <rect width="210" height="60" fill="#DCEBF7" rx="12" clip-path="polygon(0 0, 210 0, 210 60, 0 60)" />
      
      <!-- Card Title -->
      <text x="105" y="30" font-size="18" font-weight="bold" fill="#1C2D42" text-anchor="middle" dominant-baseline="central">REFIT</text>
      
      <!-- Trigger -->
      <text x="16" y="90" font-size="12" font-weight="bold" fill="#4B5E75">TRIGGER:</text>
      <text x="16" y="110" font-size="13" fill="#2C3E50">Parameter drift only;</text>
      <text x="16" y="128" font-size="13" fill="#2C3E50">data generation process</text>
      <text x="16" y="146" font-size="13" fill="#2C3E50">remains structural.</text>
      
      <!-- Action -->
      <text x="16" y="185" font-size="12" font-weight="bold" fill="#4B5E75">ACTION:</text>
      <text x="16" y="205" font-size="13" fill="#2C3E50">Update parameters</text>
      <text x="16" y="223" font-size="13" fill="#2C3E50">using recent data;</text>
      <text x="16" y="241" font-size="13" fill="#2C3E50">model form is kept.</text>
      
      <!-- Risk -->
      <text x="16" y="280" font-size="12" font-weight="bold" fill="#B23B3B">KEY RISK:</text>
      <text x="16" y="300" font-size="13" fill="#8B2626">"Chasing Noise" –</text>
      <text x="16" y="318" font-size="13" fill="#8B2626">reacting to temporary spikes.</text>
    </g>
    
    <!-- CARD 2: RESPECIFY -->
    <g transform="translate(295, 110)">
      <rect width="210" height="340" fill="#EBF7EB" rx="12" stroke="#CBEFCD" stroke-width="2" />
      <rect width="210" height="60" fill="#DCF0DC" rx="12" clip-path="polygon(0 0, 210 0, 210 60, 0 60)" />
      
      <!-- Card Title -->
      <text x="105" y="30" font-size="18" font-weight="bold" fill="#1E3A1E" text-anchor="middle" dominant-baseline="central">RESPECIFY</text>
      
      <!-- Trigger -->
      <text x="16" y="90" font-size="12" font-weight="bold" fill="#3B633B">TRIGGER:</text>
      <text x="16" y="110" font-size="13" fill="#1C3A1C">Structural shift in data;</text>
      <text x="16" y="128" font-size="13" fill="#1C3A1C">model can no longer</text>
      <text x="16" y="146" font-size="13" fill="#1C3A1C">represent the world.</text>
      
      <!-- Action -->
      <text x="16" y="185" font-size="12" font-weight="bold" fill="#3B633B">ACTION:</text>
      <text x="16" y="205" font-size="13" fill="#1C3A1C">Redesign structure,</text>
      <text x="16" y="223" font-size="13" fill="#1C3A1C">change features,</text>
      <text x="16" y="241" font-size="13" fill="#1C3A1C">priors or pooling.</text>
      
      <!-- Risk -->
      <text x="16" y="280" font-size="12" font-weight="bold" fill="#B23B3B">KEY RISK:</text>
      <text x="16" y="300" font-size="13" fill="#8B2626">"Respec-as-Panic" –</text>
      <text x="16" y="318" font-size="13" fill="#8B2626">creating fragile models.</text>
    </g>
    
    <!-- CARD 3: HOLD -->
    <g transform="translate(550, 110)">
      <rect width="210" height="340" fill="#FFF6E5" rx="12" stroke="#FEDDA4" stroke-width="2" />
      <rect width="210" height="60" fill="#FCEBD2" rx="12" clip-path="polygon(0 0, 210 0, 210 60, 0 60)" />
      
      <!-- Card Title -->
      <text x="105" y="30" font-size="18" font-weight="bold" fill="#3D2E16" text-anchor="middle" dominant-baseline="central">HOLD</text>
      
      <!-- Trigger -->
      <text x="16" y="90" font-size="12" font-weight="bold" fill="#6A512B">TRIGGER:</text>
      <text x="16" y="110" font-size="13" fill="#3A2D1A">Error is within bounds</text>
      <text x="16" y="128" font-size="13" fill="#3A2D1A">or structural cause</text>
      <text x="16" y="146" font-size="13" fill="#3A2D1A">remains unknown.</text>
      
      <!-- Action -->
      <text x="16" y="185" font-size="12" font-weight="bold" fill="#6A512B">ACTION:</text>
      <text x="16" y="205" font-size="13" fill="#3A2D1A">Decline off-cycle refits;</text>
      <text x="16" y="223" font-size="13" fill="#3A2D1A">allow standing cadence</text>
      <text x="16" y="241" font-size="13" fill="#3A2D1A">to process the window.</text>
      
      <!-- Risk -->
      <text x="16" y="280" font-size="12" font-weight="bold" fill="#B23B3B">KEY RISK:</text>
      <text x="16" y="300" font-size="13" fill="#8B2626">"Carrying Ghosts" –</text>
      <text x="16" y="318" font-size="13" fill="#8B2626">keeping stale crisis rules.</text>
    </g>
  </g>
</svg>
