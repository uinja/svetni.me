<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <!-- Background Grid -->
  <rect width="800" height="500" fill="var(--color-background)" rx="16" />
  
  <!-- Grid lines -->
  <line x1="80" y1="50" x2="80" y2="450" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="200" y1="50" x2="200" y2="450" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="320" y1="50" x2="320" y2="450" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="440" y1="50" x2="440" y2="450" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="560" y1="50" x2="560" y2="450" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="680" y1="50" x2="680" y2="450" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  
  <line x1="80" y1="100" x2="720" y2="100" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="80" y1="200" x2="720" y2="200" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="80" y1="300" x2="720" y2="300" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />
  <line x1="80" y1="400" x2="720" y2="400" stroke="var(--color-secondary)" stroke-dasharray="4 4" stroke-opacity="0.15" stroke-width="2" />

  <!-- The Shock (Faded Red/Amber curve representing COVID anomaly) -->
  <path d="M 80 320 Q 140 280 200 280 T 320 80 T 440 380 T 560 300 T 720 280" fill="none" stroke="var(--color-tertiary)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" stroke-opacity="0.4" />
  
  <!-- Adapted Forecast (Clean solid curve showing robust learning/forgetting) -->
  <path d="M 80 320 Q 140 280 200 280 T 320 270 T 440 260 T 560 260 T 720 250" fill="none" stroke="var(--color-primary)" stroke-width="6" stroke-linecap="round" />

  <!-- Data Nodes -->
  <circle cx="80" cy="320" r="7" fill="var(--color-primary)" />
  <circle cx="200" cy="280" r="7" fill="var(--color-primary)" />
  <circle cx="320" cy="270" r="7" fill="var(--color-primary)" />
  <circle cx="440" cy="260" r="7" fill="var(--color-primary)" />
  <circle cx="560" cy="260" r="7" fill="var(--color-primary)" />
  <circle cx="720" cy="250" r="7" fill="var(--color-primary)" />

  <!-- Adapting / "Unlearning" Indicator -->
  <g transform="translate(320, 80)">
    <!-- Cancel/Eraser symbol over the spike -->
    <circle cx="0" cy="0" r="32" fill="var(--color-background)" stroke="var(--color-tertiary)" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="var(--color-tertiary)" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="var(--color-tertiary)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
