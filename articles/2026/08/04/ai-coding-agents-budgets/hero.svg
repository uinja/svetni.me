<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#202124" text-anchor="middle">
    Управление на разходите при ИИ агенти (Cost Management)
  </text>
  
  <!-- Section 1: Developer / User -->
  <rect x="40" y="100" width="200" height="220" fill="#ffffff" stroke="#1a30ae" stroke-width="2" rx="6"/>
  <text x="140" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1a30ae" text-anchor="middle">Разработчик</text>
  <text x="140" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#202124" text-anchor="middle">99% работа с агенти</text>
  <text x="140" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#202124" text-anchor="middle">(Kilo Code)</text>
  <line x1="50" y1="215" x2="230" y2="215" stroke="#e0e0e0" stroke-width="1"/>
  <text x="140" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#202124" text-anchor="middle">Месечни лимити &amp; нива</text>
  <text x="140" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#202124" text-anchor="middle">(Symbotic)</text>

  <!-- Arrow 1 to proxy -->
  <path d="M 240 210 L 290 210" fill="none" stroke="#1a30ae" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Section 2: Token Proxy / Orchestration -->
  <rect x="300" y="100" width="200" height="220" fill="#1a30ae" rx="6"/>
  <text x="400" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Оркестрация &amp; Прокси</text>
  
  <!-- Replit VM -->
  <rect x="315" y="160" width="170" height="50" fill="#ffffff" rx="4"/>
  <text x="400" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1a30ae" text-anchor="middle">Token Proxy &amp; VM</text>
  <text x="400" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#202124" text-anchor="middle">(Replit - Човек в цикъла)</text>

  <!-- Kilo Cost Routing -->
  <rect x="315" y="230" width="170" height="50" fill="#ffffff" rx="4"/>
  <text x="400" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1a30ae" text-anchor="middle">Cost Routing (PR)</text>
  <text x="400" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#202124" text-anchor="middle">Оценка на ROI по задачи</text>

  <!-- Arrow 2 to models -->
  <path d="M 500 210 L 550 210" fill="none" stroke="#1a30ae" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Section 3: Decoupled Models -->
  <rect x="560" y="100" width="200" height="220" fill="#ffffff" stroke="#1a30ae" stroke-width="2" rx="6"/>
  <text x="660" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1a30ae" text-anchor="middle">ИИ модели</text>
  
  <!-- Frontier Models -->
  <rect x="575" y="160" width="170" height="50" fill="#f1f3f9" stroke="#1a30ae" stroke-width="1" rx="4"/>
  <text x="660" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1a30ae" text-anchor="middle">Скъпи Frontier LLM</text>
  <text x="660" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#202124" text-anchor="middle">Планиране &amp; Архитектура</text>

  <!-- Open Weight Models -->
  <rect x="575" y="230" width="170" height="50" fill="#f1f3f9" stroke="#1a30ae" stroke-width="1" rx="4"/>
  <text x="660" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1a30ae" text-anchor="middle">Евтини локални LLM</text>
  <text x="660" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#202124" text-anchor="middle">Изпълнение на код &amp; Тестове</text>

  <!-- Marker definition for arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a30ae"/>
    </marker>
  </defs>
</svg>