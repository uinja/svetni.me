<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <!-- Background -->
  <rect width="800" height="500" fill="#FAF8F5" rx="16" />
  
  <g font-family="system-ui, sans-serif">
    <!-- Header Section -->
    <text x="400" y="45" font-size="22" font-weight="bold" fill="#2E2B2A" text-anchor="middle" dominant-baseline="central">SOFTWARE DEVELOPMENT IN THE AI AGE</text>
    <text x="400" y="75" font-size="14" fill="#6E6865" text-anchor="middle" dominant-baseline="central">How coding shifts from manual implementation to intent, verification, and automated healing</text>
    
    <!-- CARD 1: WRITE-ONLY CODE -->
    <g transform="translate(40, 110)">
      <rect width="210" height="340" fill="#EBF3FB" rx="12" stroke="#C6DCF3" stroke-width="2" />
      <rect width="210" height="60" fill="#DCEBF7" rx="12" clip-path="polygon(0 0, 210 0, 210 60, 0 60)" />
      
      <!-- Card Title -->
      <text x="105" y="30" font-size="16" font-weight="bold" fill="#1C2D42" text-anchor="middle" dominant-baseline="central">WRITE-ONLY CODE</text>
      
      <!-- Reality -->
      <text x="16" y="90" font-size="12" font-weight="bold" fill="#4B5E75">THE REALITY:</text>
      <text x="16" y="110" font-size="13" fill="#2C3E50">AI code volume is too</text>
      <text x="16" y="128" font-size="13" fill="#2C3E50">high. Line-by-line human</text>
      <text x="16" y="146" font-size="13" fill="#2C3E50">reviews are the bottleneck.</text>
      
      <!-- Rule -->
      <text x="16" y="185" font-size="12" font-weight="bold" fill="#4B5E75">THE RULE:</text>
      <text x="16" y="205" font-size="13" fill="#2C3E50">Tests define behavior and</text>
      <text x="16" y="223" font-size="13" fill="#2C3E50">serve as documentation;</text>
      <text x="16" y="241" font-size="13" fill="#2C3E50">read inputs and outputs.</text>
      
      <!-- Shift -->
      <text x="16" y="280" font-size="12" font-weight="bold" fill="#B23B3B">KEY SHIFT:</text>
      <text x="16" y="300" font-size="13" fill="#8B2626">Code density increases;</text>
      <text x="16" y="318" font-size="13" fill="#8B2626">readability is deprioritized.</text>
    </g>
    
    <!-- CARD 2: DISPOSABLE CODE -->
    <g transform="translate(295, 110)">
      <rect width="210" height="340" fill="#FFF0F0" rx="12" stroke="#FCD7D7" stroke-width="2" />
      <rect width="210" height="60" fill="#FAD5D5" rx="12" clip-path="polygon(0 0, 210 0, 210 60, 0 60)" />
      
      <!-- Card Title -->
      <text x="105" y="30" font-size="16" font-weight="bold" fill="#4A1515" text-anchor="middle" dominant-baseline="central">DISPOSABLE CODE</text>
      
      <!-- Reality -->
      <text x="16" y="90" font-size="12" font-weight="bold" fill="#7A2D2D">THE REALITY:</text>
      <text x="16" y="110" font-size="13" fill="#4A1515">Arcane AI-generated code</text>
      <text x="16" y="128" font-size="13" fill="#4A1515">is extremely complex and</text>
      <text x="16" y="146" font-size="13" fill="#4A1515">nearly impossible to debug.</text>
      
      <!-- Rule -->
      <text x="16" y="185" font-size="12" font-weight="bold" fill="#7A2D2D">THE RULE:</text>
      <text x="16" y="205" font-size="13" fill="#4A1515">It is easier to throw away</text>
      <text x="16" y="223" font-size="13" fill="#4A1515">and rewrite code from</text>
      <text x="16" y="241" font-size="13" fill="#4A1515">scratch than to modify it.</text>
      
      <!-- Shift -->
      <text x="16" y="280" font-size="12" font-weight="bold" fill="#B23B3B">KEY SHIFT:</text>
      <text x="16" y="300" font-size="13" fill="#8B2626">Keep the test suite;</text>
      <text x="16" y="318" font-size="13" fill="#8B2626">discard &amp; recreate code.</text>
    </g>
    
    <!-- CARD 3: SELF-HEALING SYSTEMS -->
    <g transform="translate(550, 110)">
      <rect width="210" height="340" fill="#EBF7EB" rx="12" stroke="#CBEFCD" stroke-width="2" />
      <rect width="210" height="60" fill="#DCF0DC" rx="12" clip-path="polygon(0 0, 210 0, 210 60, 0 60)" />
      
      <!-- Card Title -->
      <text x="105" y="30" font-size="16" font-weight="bold" fill="#1E3A1E" text-anchor="middle" dominant-baseline="central">SELF-HEALING</text>
      
      <!-- Reality -->
      <text x="16" y="90" font-size="12" font-weight="bold" fill="#3B633B">THE REALITY:</text>
      <text x="16" y="110" font-size="13" fill="#1C3A1C">Errors are detected by</text>
      <text x="16" y="128" font-size="13" fill="#1C3A1C">observability platforms</text>
      <text x="16" y="146" font-size="13" fill="#1C3A1C">directly in production.</text>
      
      <!-- Rule -->
      <text x="16" y="185" font-size="12" font-weight="bold" fill="#3B633B">THE RULE:</text>
      <text x="16" y="205" font-size="13" fill="#1C3A1C">AI coding agents monitor</text>
      <text x="16" y="223" font-size="13" fill="#1C3A1C">alerts and submit auto-</text>
      <text x="16" y="241" font-size="13" fill="#1C3A1C">healing pull requests.</text>
      
      <!-- Shift -->
      <text x="16" y="280" font-size="12" font-weight="bold" fill="#B23B3B">KEY SHIFT:</text>
      <text x="16" y="300" font-size="13" fill="#8B2626">CI review agents use</text>
      <text x="16" y="318" font-size="13" fill="#8B2626">adversarial model loops.</text>
    </g>
  </g>
</svg>
