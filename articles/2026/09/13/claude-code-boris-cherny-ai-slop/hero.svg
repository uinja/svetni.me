<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)" />

  <!-- Subtle background grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="480" y1="0" x2="480" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <!-- Left: Raw Chaotic Code & Slop Fragments -->
  <g transform="translate(100, 140)">
    <rect width="300" height="470" rx="16" fill="#151d30" stroke="#334155" stroke-width="2" />
    <rect x="20" y="20" width="80" height="12" rx="6" fill="#475569" />
    <circle cx="250" cy="26" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="270" cy="26" r="6" fill="#f59e0b" opacity="0.8" />
    
    <!-- Code rows -->
    <rect x="30" y="70" width="180" height="12" rx="4" fill="#64748b" opacity="0.6" />
    <rect x="50" y="92" width="210" height="12" rx="4" fill="#f97316" opacity="0.4" />
    <rect x="50" y="112" width="160" height="12" rx="4" fill="#f97316" opacity="0.3" />
    <rect x="70" y="132" width="190" height="12" rx="4" fill="#94a3b8" opacity="0.4" />

    <!-- Error indicator panel -->
    <g transform="translate(30, 165)">
      <rect width="240" height="70" rx="10" fill="#7f1d1d" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.5" />
      <circle cx="35" cy="35" r="14" fill="#dc2626" />
      <path d="M35 27 L35 37 M35 41 L35 43" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <rect x="65" y="25" width="120" height="8" rx="4" fill="#fca5a5" />
      <rect x="65" y="40" width="150" height="6" rx="3" fill="#f87171" opacity="0.7" />
    </g>

    <rect x="30" y="260" width="140" height="12" rx="4" fill="#64748b" opacity="0.5" />
    <rect x="50" y="282" width="220" height="12" rx="4" fill="#f97316" opacity="0.35" />
    <rect x="50" y="302" width="170" height="12" rx="4" fill="#94a3b8" opacity="0.4" />
    <rect x="70" y="322" width="150" height="10" rx="3" fill="#64748b" opacity="0.3" />

    <rect x="30" y="360" width="240" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="45" y="380" width="90" height="8" rx="4" fill="#94a3b8" />
    <rect x="45" y="398" width="190" height="8" rx="4" fill="#64748b" opacity="0.6" />
    <rect x="45" y="416" width="130" height="8" rx="4" fill="#475569" opacity="0.5" />
  </g>

  <!-- Center: Guardrail Portal and Quality Gateway Shield -->
  <g transform="translate(480, 110)">
    <!-- Outer Shield Shape -->
    <path d="M 120 40 L 220 90 L 220 270 C 220 410 120 490 120 490 C 120 490 20 410 20 270 L 20 90 Z" fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="4" />
    
    <!-- Inner Shield Shape -->
    <path d="M 120 75 L 195 115 L 195 255 C 195 365 120 435 120 435 C 120 435 45 365 45 255 L 45 115 Z" fill="#0f172a" stroke="#60a5fa" stroke-width="2" opacity="0.95" />

    <!-- Center Core Emblem -->
    <circle cx="120" cy="220" r="45" fill="url(#coreGrad)" stroke="#fbbf24" stroke-width="3" />
    
    <!-- Quality Checkmark Icon -->
    <path d="M 102 220 L 115 233 L 140 208" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Guardrail orbital satellites -->
    <circle cx="120" cy="115" r="8" fill="#60a5fa" />
    <circle cx="120" cy="330" r="8" fill="#10b981" />
    <circle cx="65" cy="220" r="8" fill="#f59e0b" />
    <circle cx="175" cy="220" r="8" fill="#3b82f6" />
    
    <circle cx="120" cy="220" r="65" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7" />
  </g>

  <!-- Flow connecting paths -->
  <path d="M 400 375 C 440 375 460 330 500 330" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 700 330 C 740 330 760 375 800 375" fill="none" stroke="#10b981" stroke-width="3" opacity="0.9" />

  <!-- Right: Pure, Verified Production Architecture -->
  <g transform="translate(800, 140)">
    <rect width="300" height="470" rx="16" fill="#151d30" stroke="#10b981" stroke-width="2" />
    <rect x="20" y="20" width="80" height="12" rx="6" fill="#10b981" />
    <circle cx="270" cy="26" r="6" fill="#10b981" />
    <circle cx="250" cy="26" r="6" fill="#3b82f6" />

    <!-- Card 1 -->
    <g transform="translate(25, 65)">
      <rect width="250" height="95" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="15" y="15" width="100" height="10" rx="3" fill="#38bdf8" />
      <rect x="15" y="35" width="220" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="50" width="180" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="68" width="60" height="12" rx="4" fill="#10b981" opacity="0.3" />
      <rect x="85" y="68" width="50" height="12" rx="4" fill="#3b82f6" opacity="0.3" />
    </g>

    <!-- Card 2 -->
    <g transform="translate(25, 180)">
      <rect width="250" height="95" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="15" y="15" width="80" height="10" rx="3" fill="#10b981" />
      <rect x="15" y="35" width="200" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="50" width="150" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="68" width="70" height="12" rx="4" fill="#10b981" opacity="0.3" />
    </g>

    <!-- Card 3 -->
    <g transform="translate(25, 295)">
      <rect width="250" height="145" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <rect x="15" y="15" width="120" height="10" rx="3" fill="#a78bfa" />
      <rect x="15" y="38" width="210" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="54" width="190" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="70" width="160" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="86" width="140" height="8" rx="2" fill="#94a3b8" opacity="0.5" />
      <rect x="15" y="110" width="90" height="18" rx="6" fill="#10b981" />
    </g>
  </g>
</svg>