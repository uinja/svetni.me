<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="50" y="40" width="700" height="60" rx="10" fill="#1a30ae"/>
  <text x="400" y="77" fill="#ffffff" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">Google AX: Core Architectural Pillars</text>
  
  <rect x="60" y="130" width="190" height="310" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="2"/>
  <text x="155" y="170" fill="#1a30ae" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">1. Declarative YAML</text>
  <text x="80" y="210" fill="#202124" font-size="13" font-family="sans-serif">Define tasks &amp; goals</text>
  <text x="80" y="240" fill="#202124" font-size="13" font-family="sans-serif">Tool permissions spec</text>
  <text x="80" y="270" fill="#202124" font-size="13" font-family="sans-serif">Multi-agent graphs</text>
  
  <rect x="305" y="130" width="190" height="310" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="2"/>
  <text x="400" y="170" fill="#1a30ae" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">2. Strict Sandboxing</text>
  <text x="325" y="210" fill="#202124" font-size="13" font-family="sans-serif">Isolated filesystem</text>
  <text x="325" y="240" fill="#202124" font-size="13" font-family="sans-serif">Fenced network egress</text>
  <text x="325" y="270" fill="#202124" font-size="13" font-family="sans-serif">Host security guards</text>

  <rect x="550" y="130" width="190" height="310" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="2"/>
  <text x="645" y="170" fill="#1a30ae" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">3. Massive Scale</text>
  <text x="570" y="210" fill="#202124" font-size="13" font-family="sans-serif">Cluster execution</text>
  <text x="570" y="240" fill="#202124" font-size="13" font-family="sans-serif">Task parallelization</text>
  <text x="570" y="270" fill="#202124" font-size="13" font-family="sans-serif">Low-latency IPC</text>
</svg>\n