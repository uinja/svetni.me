<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="50" y="30" width="700" height="50" rx="8" fill="#1a30ae"/>
  <text x="400" y="62" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">AI Optical Barcode Senescence Detection Pipeline</text>

  <rect x="60" y="110" width="200" height="340" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="1"/>
  <text x="160" y="145" fill="#1a30ae" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">1. Optical Tagging</text>
  <text x="75" y="190" fill="#202124" font-size="12" font-family="sans-serif">Molecular barcodes</text>
  <text x="75" y="215" fill="#202124" font-size="12" font-family="sans-serif">Targeted biomarkers</text>
  <text x="75" y="240" fill="#202124" font-size="12" font-family="sans-serif">Tissue staining</text>

  <rect x="300" y="110" width="200" height="340" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="1"/>
  <text x="400" y="145" fill="#1a30ae" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">2. Deep Learning</text>
  <text x="315" y="190" fill="#202124" font-size="12" font-family="sans-serif">Convolutional models</text>
  <text x="315" y="215" fill="#202124" font-size="12" font-family="sans-serif">Barcode decoding</text>
  <text x="315" y="240" fill="#202124" font-size="12" font-family="sans-serif">Spatial cell mapping</text>

  <rect x="540" y="110" width="200" height="340" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="1"/>
  <text x="640" y="145" fill="#137333" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">3. Senotherapy</text>
  <text x="555" y="190" fill="#202124" font-size="12" font-family="sans-serif">Targeted drug delivery</text>
  <text x="555" y="215" fill="#202124" font-size="12" font-family="sans-serif">Anti-aging trials</text>
  <text x="555" y="240" fill="#202124" font-size="12" font-family="sans-serif">Tissue regeneration</text>
</svg>\n