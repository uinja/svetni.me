<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <rect width="1200" height="750" fill="#0b0f19"/>
  
  <!-- Subtle circular grid -->
  <circle cx="600" cy="375" r="280" fill="none" stroke="#1f293d" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="600" cy="375" r="180" fill="none" stroke="#1f293d" stroke-width="2" stroke-dasharray="4 6"/>
  
  <!-- Central Orchestration Core (Cloudflare orange) -->
  <circle cx="600" cy="375" r="70" fill="#1e140d" stroke="#f6821f" stroke-width="4"/>
  <circle cx="600" cy="375" r="30" fill="#f6821f" opacity="0.8"/>
  
  <!-- Continuous Agent Cycle (4 nodes) -->
  <!-- Node 1: Code / Synthesis (Top) -->
  <circle cx="600" cy="180" r="45" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <rect x="585" y="170" width="30" height="20" rx="4" fill="#38bdf8"/>
  
  <!-- Node 2: Testing / Sandbox (Right) -->
  <circle cx="795" cy="375" r="45" fill="#0f172a" stroke="#a855f7" stroke-width="3"/>
  <polygon points="785,360 815,375 785,390" fill="#a855f7"/>
  
  <!-- Node 3: Deployment / Preview (Bottom) -->
  <circle cx="600" cy="570" r="45" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <polyline points="585,570 595,580 615,560" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Node 4: Trust Ratchet / Security (Left) -->
  <circle cx="405" cy="375" r="45" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
  <rect x="393" y="365" width="24" height="20" rx="3" fill="#ef4444"/>
  <path d="M400 365 L400 355 A5 5 0 0 1 410 355 L410 365" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Curved Orbit Flow Arrows -->
  <path d="M645 190 A240 240 0 0 1 785 330" fill="none" stroke="#f6821f" stroke-width="4" stroke-linecap="round"/>
  <path d="M785 420 A240 240 0 0 1 645 560" fill="none" stroke="#f6821f" stroke-width="4" stroke-linecap="round"/>
  <path d="M555 560 A240 240 0 0 1 415 420" fill="none" stroke="#f6821f" stroke-width="4" stroke-linecap="round"/>
  <path d="M415 330 A240 240 0 0 1 555 190" fill="none" stroke="#f6821f" stroke-width="4" stroke-linecap="round"/>
</svg>
