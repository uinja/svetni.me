<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <rect width="800" height="500" fill="#ffffff"/>
  <rect x="50" y="30" width="700" height="50" rx="8" fill="#1a30ae"/>
  <text x="400" y="62" fill="#ffffff" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">AI Military Crisis Communication Protocol</text>

  <rect x="60" y="110" width="200" height="340" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="1"/>
  <text x="160" y="145" fill="#d93025" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">Emerging Risks</text>
  <text x="75" y="190" fill="#202124" font-size="12" font-family="sans-serif">Autonomous drone swarms</text>
  <text x="75" y="215" fill="#202124" font-size="12" font-family="sans-serif">Automated cyber defenses</text>
  <text x="75" y="240" fill="#202124" font-size="12" font-family="sans-serif">Sub-second escalation</text>

  <rect x="300" y="110" width="200" height="340" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="1"/>
  <text x="400" y="145" fill="#1a30ae" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">The "Red Phone" Channel</text>
  <text x="315" y="190" fill="#202124" font-size="12" font-family="sans-serif">Direct military hotlines</text>
  <text x="315" y="215" fill="#202124" font-size="12" font-family="sans-serif">Nuclear command limits</text>
  <text x="315" y="240" fill="#202124" font-size="12" font-family="sans-serif">Verification protocols</text>

  <rect x="540" y="110" width="200" height="340" rx="8" fill="#f8f9fa" stroke="#e8eaed" stroke-width="1"/>
  <text x="640" y="145" fill="#137333" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">Safety Guardrails</text>
  <text x="555" y="190" fill="#202124" font-size="12" font-family="sans-serif">Human-in-the-loop mandate</text>
  <text x="555" y="215" fill="#202124" font-size="12" font-family="sans-serif">Crisis transparency</text>
  <text x="555" y="240" fill="#202124" font-size="12" font-family="sans-serif">Algorithmic limits</text>
</svg>\n