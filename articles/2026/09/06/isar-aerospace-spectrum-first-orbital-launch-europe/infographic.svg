<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; }
      .text-regular { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; }
      .text-medium { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#fbf8f3" />

  <!-- Header Section -->
  <rect x="285" y="16" width="230" height="22" rx="11" fill="#f1ebd8" stroke="#e2d9be" stroke-width="1" />
  <text x="400" y="31" class="text-bold" font-size="10" fill="#854d0e" text-anchor="middle" letter-spacing="1">EUROPEAN SPACE LOGISTICS</text>

  <text x="400" y="60" class="title" font-size="20" fill="#0f172a" text-anchor="middle">Isar Aerospace Spectrum: Historic Orbital Debut</text>
  <text x="400" y="80" class="text-medium" font-size="11" fill="#475569" text-anchor="middle">First orbital mission from continental Western Europe successfully deploying payloads into LEO</text>

  <!-- Column 1: Continental Orbit -->
  <g transform="translate(24, 98)">
    <rect width="176" height="352" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="88" cy="30" r="16" fill="#0284c7" />
    <!-- Globe / Orbit Icon -->
    <circle cx="88" cy="30" r="9" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <ellipse cx="88" cy="30" rx="12" ry="4" fill="none" stroke="#ffffff" stroke-width="1.2" transform="rotate(-25 88 30)" />
    <!-- Titles -->
    <text x="88" y="62" class="title" font-size="13" fill="#0f172a" text-anchor="middle">Continental Orbit</text>
    <text x="88" y="76" class="text-bold" font-size="9" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">ANDØYA SPACEPORT</text>
    <line x1="16" y1="86" x2="160" y2="86" stroke="#7dd3fc" stroke-width="1" />
    <!-- Body Text -->
    <text x="14" y="106" class="text-medium" font-size="10" fill="#334155">
      <tspan x="14" dy="0" font-weight="700" fill="#0f172a">Historic First:</tspan>
      <tspan x="14" dy="14">No rocket had reached</tspan>
      <tspan x="14" dy="14">orbit from Western</tspan>
      <tspan x="14" dy="14">Europe until today.</tspan>
      <tspan x="14" dy="18">Liftoff from northern</tspan>
      <tspan x="14" dy="14">Norway on <tspan font-weight="700" fill="#0369a1">Sept 5, 2026</tspan></tspan>
      <tspan x="14" dy="14">at 4:12 PM EDT (22:12).</tspan>
      <tspan x="14" dy="18">Entered orbit in just</tspan>
      <tspan x="14" dy="14">over <tspan font-weight="700" fill="#0f172a">seven minutes</tspan>.</tspan>
    </text>
    <!-- Highlight Card -->
    <rect x="12" y="244" width="152" height="96" rx="8" fill="#ffffff" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="1" />
    <text x="20" y="264" class="text-medium" font-size="9" font-style="italic" fill="#1e293b">
      <tspan x="20" dy="0">&quot;Making history for</tspan>
      <tspan x="20" dy="13">Spectrum, making</tspan>
      <tspan x="20" dy="13">history for Isar, and</tspan>
      <tspan x="20" dy="13">making history for</tspan>
      <tspan x="20" dy="13">Europe.&quot; — Petrakis</tspan>
    </text>
  </g>

  <!-- Column 2: Spectrum Launcher -->
  <g transform="translate(216, 98)">
    <rect width="176" height="352" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="88" cy="30" r="16" fill="#475569" />
    <!-- Rocket Icon -->
    <path d="M88 19 L93 27 L91 35 L85 35 L83 27 Z M82 35 L80 39 L84 37 Z M94 35 L96 39 L92 37 Z" fill="#ffffff" />
    <!-- Titles -->
    <text x="88" y="62" class="title" font-size="13" fill="#0f172a" text-anchor="middle">Spectrum Vehicle</text>
    <text x="88" y="76" class="text-bold" font-size="9" fill="#334155" text-anchor="middle" letter-spacing="0.5">TECHNICAL SPECS</text>
    <line x1="16" y1="86" x2="160" y2="86" stroke="#cbd5e1" stroke-width="1" />
    <!-- Body Text -->
    <text x="14" y="106" class="text-medium" font-size="10" fill="#334155">
      <tspan x="14" dy="0" font-weight="700" fill="#0f172a">Two-Stage Architecture:</tspan>
      <tspan x="14" dy="14">Height: <tspan font-weight="700" fill="#0f172a">28 m (95 ft)</tspan></tspan>
      <tspan x="14" dy="14">Diameter: <tspan font-weight="700" fill="#0f172a">2 meters</tspan>.</tspan>
      <tspan x="14" dy="18">Payload Capacity:</tspan>
      <tspan x="14" dy="14">Up to <tspan font-weight="700" fill="#0f172a">1,000 kg (2,200 lb)</tspan></tspan>
      <tspan x="14" dy="14">to Low Earth Orbit (LEO).</tspan>
      <tspan x="14" dy="18">Mass Production:</tspan>
      <tspan x="14" dy="14">Munich plant built to yield</tspan>
      <tspan x="14" dy="14"><tspan font-weight="700" fill="#0f172a">&gt;30 rockets/year</tspan>.</tspan>
    </text>
    <!-- Highlight Card -->
    <rect x="12" y="244" width="152" height="96" rx="8" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="264" class="text-medium" font-size="9" font-style="italic" fill="#1e293b">
      <tspan x="20" dy="0">&quot;Designed to become</tspan>
      <tspan x="20" dy="13">the primary commercial</tspan>
      <tspan x="20" dy="13">workhorse for small</tspan>
      <tspan x="20" dy="13">and medium satellite</tspan>
      <tspan x="20" dy="13">constellations.&quot;</tspan>
    </text>
  </g>

  <!-- Column 3: Flight 2 Resilience -->
  <g transform="translate(408, 98)">
    <rect width="176" height="352" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="88" cy="30" r="16" fill="#d97706" />
    <!-- Wrench / Tool Icon -->
    <path d="M83 23 A5 5 0 0 1 93 30 L85 38 L81 34 L89 26 A5 5 0 0 1 83 23 Z" fill="#ffffff" />
    <!-- Titles -->
    <text x="88" y="62" class="title" font-size="13" fill="#0f172a" text-anchor="middle">Flight 2 Resilience</text>
    <text x="88" y="76" class="text-bold" font-size="9" fill="#92400e" text-anchor="middle" letter-spacing="0.5">ONWARD AND UPWARD</text>
    <line x1="16" y1="86" x2="160" y2="86" stroke="#fcd34d" stroke-width="1" />
    <!-- Body Text -->
    <text x="14" y="106" class="text-medium" font-size="10" fill="#334155">
      <tspan x="14" dy="0" font-weight="700" fill="#0f172a">Overcoming Setbacks:</tspan>
      <tspan x="14" dy="14">March 2025 debut failed</tspan>
      <tspan x="14" dy="14">under 1 min due to vent</tspan>
      <tspan x="14" dy="14">valve &amp; attitude loss.</tspan>
      <tspan x="14" dy="18">2026 delays: valve leaks,</tspan>
      <tspan x="14" dy="14">Arctic storms, intruding</tspan>
      <tspan x="14" dy="14">boats &amp; fluid issues.</tspan>
      <tspan x="14" dy="18">Engineering fixes</tspan>
      <tspan x="14" dy="14">ensured flawless flight.</tspan>
    </text>
    <!-- Highlight Card -->
    <rect x="12" y="244" width="152" height="96" rx="8" fill="#ffffff" fill-opacity="0.85" stroke="#fcd34d" stroke-width="1" />
    <text x="20" y="264" class="text-medium" font-size="9" font-style="italic" fill="#1e293b">
      <tspan x="20" dy="0">&quot;We had setbacks, but</tspan>
      <tspan x="20" dy="13">we came back stronger.</tspan>
      <tspan x="20" dy="13">It validates our</tspan>
      <tspan x="20" dy="13">engineering teams</tspan>
      <tspan x="20" dy="13">across the board.&quot;</tspan>
    </text>
  </g>

  <!-- Column 4: Full Mission Success -->
  <g transform="translate(600, 98)">
    <rect width="176" height="352" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="88" cy="30" r="16" fill="#16a34a" />
    <!-- Checkmark Icon -->
    <path d="M80 30 L85 35 L96 23" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Titles -->
    <text x="88" y="62" class="title" font-size="13" fill="#0f172a" text-anchor="middle">Payload Success</text>
    <text x="88" y="76" class="text-bold" font-size="9" fill="#166534" text-anchor="middle" letter-spacing="0.5">6 SCIENTIFIC PAYLOADS</text>
    <line x1="16" y1="86" x2="160" y2="86" stroke="#86efac" stroke-width="1" />
    <!-- Body Text -->
    <text x="14" y="106" class="text-medium" font-size="10" fill="#334155">
      <tspan x="14" dy="0" font-weight="700" fill="#0f172a">Orbit &amp; Deployment:</tspan>
      <tspan x="14" dy="14">Initial elliptical path:</tspan>
      <tspan x="14" dy="14"><tspan font-weight="700" fill="#166534">180 km x 500 km</tspan>.</tspan>
      <tspan x="14" dy="18">Upper stage performed</tspan>
      <tspan x="14" dy="14">circularization burn.</tspan>
      <tspan x="14" dy="18">Deployed <tspan font-weight="700" fill="#0f172a">5 CubeSats</tspan> and</tspan>
      <tspan x="14" dy="14">1 non-deployable payload</tspan>
      <tspan x="14" dy="14"><tspan font-weight="700" fill="#166534">~2 hours post-launch</tspan>.</tspan>
    </text>
    <!-- Highlight Card -->
    <rect x="12" y="244" width="152" height="96" rx="8" fill="#ffffff" fill-opacity="0.85" stroke="#86efac" stroke-width="1" />
    <text x="20" y="264" class="text-medium" font-size="9" font-style="italic" fill="#1e293b">
      <tspan x="20" dy="0">&quot;Full mission declared</tspan>
      <tspan x="20" dy="13">a complete success</tspan>
      <tspan x="20" dy="13">after all customer</tspan>
      <tspan x="20" dy="13">payloads separated as</tspan>
      <tspan x="20" dy="13">planned into LEO.&quot;</tspan>
    </text>
  </g>

  <!-- Footer -->
  <line x1="24" y1="466" x2="776" y2="466" stroke="#e7dfd1" stroke-width="1" />
  <text x="24" y="484" class="text-medium" font-size="9" fill="#64748b">Source: Space.com (Mike Wall), Isar Aerospace webcast &amp; mission updates</text>
  <text x="776" y="484" class="text-bold" font-size="9" fill="#64748b" text-anchor="end">Svetni.me Synthesis</text>
</svg>