<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0a1226" />
      <stop offset="75%" stop-color="#0d1d3a" />
      <stop offset="100%" stop-color="#132742" />
    </linearGradient>
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="plume-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="heavy-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Deep Arctic Night Sky -->
  <rect width="800" height="500" fill="url(#sky-grad)" />

  <!-- Aurora Borealis Bands -->
  <path d="M-40 120 Q 200 40, 420 110 T 840 80 L 840 220 Q 600 160, 360 210 T -40 190 Z" fill="url(#aurora-grad)" filter="url(#blur-filter)" opacity="0.6" />
  <path d="M-20 70 Q 260 20, 500 80 T 840 50 L 840 150 Q 550 110, 240 140 T -20 120 Z" fill="url(#aurora-grad)" filter="url(#blur-filter)" opacity="0.4" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="50" r="1.2" />
    <circle cx="140" cy="85" r="1" />
    <circle cx="220" cy="35" r="1.5" />
    <circle cx="280" cy="110" r="0.8" />
    <circle cx="350" cy="45" r="1.2" />
    <circle cx="480" cy="30" r="1" />
    <circle cx="560" cy="70" r="1.6" />
    <circle cx="650" cy="40" r="1" />
    <circle cx="730" cy="95" r="1.3" />
    <circle cx="110" cy="145" r="0.9" />
    <circle cx="690" cy="150" r="1.1" />
    <circle cx="760" cy="30" r="1.4" />
  </g>

  <!-- Distant Mountains / Norwegian Fjords Silhouettes -->
  <polygon points="-20,380 110,290 230,370 340,310 490,380 620,300 750,370 820,330 820,440 -20,440" fill="#0c1626" />
  <polygon points="-20,400 90,340 180,390 290,335 420,400 550,350 680,405 820,360 820,450 -20,450" fill="#080f1a" opacity="0.8" />

  <!-- Arctic Ocean / Fjord Waters -->
  <rect x="0" y="410" width="800" height="90" fill="url(#sea-grad)" />
  <ellipse cx="400" cy="430" rx="240" ry="12" fill="#38bdf8" opacity="0.05" filter="url(#blur-filter)" />

  <!-- Launch Platform & Pad (Andoya) on Coast -->
  <g transform="translate(180, 360)">
    <!-- Coastline Rocks -->
    <path d="M-120 60 Q -60 30, 20 45 T 160 55 L 180 140 L -140 140 Z" fill="#070d18" />
    <!-- Launch Mount & Tower -->
    <rect x="40" y="15" width="28" height="45" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="32" y="45" width="44" height="15" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <!-- Service Umbilical Truss Structure -->
    <line x1="30" y1="55" x2="30" y2="-30" stroke="#475569" stroke-width="2.5" />
    <line x1="22" y1="55" x2="22" y2="-25" stroke="#334155" stroke-width="1.8" />
    <line x1="22" y1="-20" x2="30" y2="-10" stroke="#475569" stroke-width="1" />
    <line x1="22" y1="-5" x2="30" y2="5" stroke="#475569" stroke-width="1" />
    <line x1="22" y1="10" x2="30" y2="20" stroke="#475569" stroke-width="1" />
    <line x1="22" y1="25" x2="30" y2="35" stroke="#475569" stroke-width="1" />
    <line x1="30" y1="-15" x2="44" y2="-15" stroke="#64748b" stroke-width="1.5" />
    <!-- Safety / Flood Lights -->
    <circle cx="18" cy="-22" r="2" fill="#38bdf8" />
    <circle cx="42" cy="52" r="2" fill="#f59e0b" />
  </g>

  <!-- Rocket Trajectory Arc (Subtle orbital curve towards upper right) -->
  <path d="M 234 380 Q 250 260, 480 90" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  <path d="M 234 380 Q 260 270, 480 90" fill="none" stroke="#ffedd5" stroke-width="1" opacity="0.25" />

  <!-- Orbital Trajectory Expansion Cone into Space -->
  <path d="M 480 90 L 760 30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" opacity="0.7" />
  <polygon points="760,26 774,30 760,34" fill="#38bdf8" opacity="0.8" />

  <!-- Plume Ambient Light Halo -->
  <ellipse cx="475" cy="115" rx="70" ry="50" fill="#f97316" opacity="0.2" filter="url(#heavy-blur)" />

  <!-- The Spectrum Rocket (In Flight, Ascending) -->
  <!-- Center at (480, 90), rotated by ~-32 degrees along its flight path -->
  <g transform="translate(480, 90) rotate(-32)">
    <!-- Exhaust Plume & Flame Cone -->
    <g transform="translate(0, 50)">
      <!-- Outer Flame -->
      <polygon points="-10,0 0,110 10,0" fill="url(#flame-grad)" />
      <!-- Mid Flame -->
      <polygon points="-6,0 0,80 6,0" fill="#fef08a" opacity="0.9" />
      <!-- Core White Jet -->
      <polygon points="-3,0 0,45 3,0" fill="#ffffff" />
      <!-- Expansion Shock Diamonds -->
      <polygon points="0,15 3,25 0,35 -3,25" fill="#ffffff" opacity="0.8" />
      <polygon points="0,40 2.5,50 0,60 -2.5,50" fill="#ffffff" opacity="0.6" />
      <polygon points="0,65 2,74 0,82 -2,74" fill="#ffffff" opacity="0.4" />
    </g>

    <!-- Spectrum Rocket Body (28m slender 2-stage design) -->
    <!-- First Stage Engine Bells -->
    <rect x="-7" y="46" width="14" height="4" rx="1" fill="#334155" />
    <polygon points="-8,50 -4,46 4,46 8,50" fill="#1e293b" />

    <!-- First Stage Interstage & Main Fuselage -->
    <rect x="-6" y="8" width="12" height="38" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />
    
    <!-- Interstage Ring (Stage Separation Line) -->
    <rect x="-6.5" y="6" width="13" height="3" fill="#0f172a" />

    <!-- Second Stage Body -->
    <rect x="-6" y="-18" width="12" height="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Aerodynamic Payload Fairing (Nosecone) -->
    <path d="M-6 -18 Q -6 -36, 0 -44 Q 6 -36, 6 -18 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Isar Accent Stripe (Dark Slate / Arctic Blue) -->
    <rect x="-6" y="-8" width="12" height="4" fill="#0284c7" />
    <line x1="-6" y1="22" x2="6" y2="22" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- Grid Stabilizer Fins -->
    <polygon points="-6,36 -12,46 -6,44" fill="#334155" />
    <polygon points="6,36 12,46 6,44" fill="#334155" />
  </g>

  <!-- Orbital Ring / Earth Horizon Curvature Horizon Overlay -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <ellipse cx="400" cy="900" rx="750" ry="500" fill="none" />
    <ellipse cx="400" cy="920" rx="780" ry="500" fill="none" />
  </g>

  <!-- Technical Telemetry Geometry (Zero Text) -->
  <g transform="translate(40, 40)" opacity="0.4">
    <!-- Reticle Corner Marks -->
    <path d="M0 16 L0 0 L16 0" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="8" r="2" fill="#38bdf8" />
    <line x1="32" y1="8" x2="60" y2="8" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  </g>

  <g transform="translate(740, 40)" opacity="0.4">
    <path d="M20 16 L20 0 L4 0" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-4" cy="8" r="2" fill="#10b981" />
  </g>
</svg>