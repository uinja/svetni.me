<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="#FAF8F5" rx="16" />

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Header Section -->
    <rect x="475" y="32" width="250" height="26" rx="6" fill="#E2ECF8" />
    <text x="600" y="45" font-size="12" font-weight="700" fill="#2B4C7E" text-anchor="middle" dominant-baseline="central" letter-spacing="1.2">LEGAL &amp; FORENSIC BREAKDOWN</text>
    
    <text x="600" y="85" font-size="28" font-weight="800" fill="#1A1E1C" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5">Apple vs OpenAI: Trade Secret Litigation</text>
    <text x="600" y="115" font-size="15" fill="#5A645F" text-anchor="middle" dominant-baseline="central">Key evidence, deletion allegations, and legal escalations over confidential hardware data</text>

    <!-- CARD 1: FORENSIC LAPTOP EVIDENCE -->
    <g transform="translate(48, 150)">
      <rect width="255" height="520" fill="#EBF2FA" rx="14" stroke="#D3E2F4" stroke-width="2" />
      <rect width="255" height="68" fill="#DCE8F5" rx="14" />
      <rect width="255" height="20" y="48" fill="#DCE8F5" />
      
      <!-- Icon Circle -->
      <circle cx="42" cy="34" r="20" fill="#FFFFFF" />
      <rect x="33" y="25" width="18" height="18" rx="3" fill="none" stroke="#2B4C7E" stroke-width="2" />
      <circle cx="42" cy="34" r="3" fill="#2B4C7E" />

      <!-- Title -->
      <text x="74" y="34" font-size="16" font-weight="700" fill="#1C2E4A" dominant-baseline="central">Forensic Findings</text>

      <!-- Section 1 -->
      <text x="20" y="96" font-size="12" font-weight="700" fill="#2B4C7E">HARDWARE SCHEMATICS</text>
      <text x="20" y="118" font-size="13" fill="#2A332E">Confidential Apple circuit</text>
      <text x="20" y="136" font-size="13" fill="#2A332E">diagram allegedly found on</text>
      <text x="20" y="154" font-size="13" fill="#2A332E">former employee's laptop.</text>

      <!-- Section 2 -->
      <text x="20" y="196" font-size="12" font-weight="700" fill="#2B4C7E">PROPRIETARY TOOL</text>
      <text x="20" y="218" font-size="13" fill="#2A332E">Evidence shows usage of</text>
      <text x="20" y="236" font-size="13" fill="#2A332E">an engineering app matching</text>
      <text x="20" y="254" font-size="13" fill="#2A332E">internal Apple software.</text>

      <!-- Section 3 -->
      <text x="20" y="296" font-size="12" font-weight="700" fill="#2B4C7E">DEVICE SURRENDER</text>
      <text x="20" y="318" font-size="13" fill="#2A332E">Liu's MacBook was handed</text>
      <text x="20" y="336" font-size="13" fill="#2A332E">over by defense counsel</text>
      <text x="20" y="354" font-size="13" fill="#2A332E">after weeks of delay.</text>

      <!-- Badge / Summary -->
      <rect x="20" y="430" width="215" height="65" rx="8" fill="#FFFFFF" stroke="#D3E2F4" stroke-width="1.5" />
      <text x="32" y="454" font-size="11" font-weight="700" fill="#2B4C7E">KEY CLAIM</text>
      <text x="32" y="474" font-size="12" font-weight="600" fill="#1C2E4A">Active trade secret usage</text>
    </g>

    <!-- CARD 2: EVIDENCE DESTRUCTION -->
    <g transform="translate(327, 150)">
      <rect width="255" height="520" fill="#FCEDE6" rx="14" stroke="#F6D6C8" stroke-width="2" />
      <rect width="255" height="68" fill="#F8DFD4" rx="14" />
      <rect width="255" height="20" y="48" fill="#F8DFD4" />
      
      <!-- Icon Circle -->
      <circle cx="42" cy="34" r="20" fill="#FFFFFF" />
      <path d="M36 28h12M38 28v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V28" fill="none" stroke="#B84A28" stroke-width="2" stroke-linecap="round" />

      <!-- Title -->
      <text x="74" y="34" font-size="16" font-weight="700" fill="#421C11" dominant-baseline="central">Data Deletion</text>

      <!-- Section 1 -->
      <text x="20" y="96" font-size="12" font-weight="700" fill="#B84A28">COLLEAGUE ASSISTANCE</text>
      <text x="20" y="118" font-size="13" fill="#3D2922">Liu enlisted OpenAI peer</text>
      <text x="20" y="136" font-size="13" fill="#3D2922">Yu-Ting Peng to help erase</text>
      <text x="20" y="154" font-size="13" fill="#3D2922">traces in June 2026.</text>

      <!-- Section 2 -->
      <text x="20" y="196" font-size="12" font-weight="700" fill="#B84A28">TIMING &amp; TRIGGER</text>
      <text x="20" y="218" font-size="13" fill="#3D2922">Destruction occurred right</text>
      <text x="20" y="236" font-size="13" fill="#3D2922">after learning Apple opened</text>
      <text x="20" y="254" font-size="13" fill="#3D2922">an investigation.</text>

      <!-- Section 3 -->
      <text x="20" y="296" font-size="12" font-weight="700" fill="#B84A28">TEXT COMMUNICATIONS</text>
      <text x="20" y="318" font-size="13" fill="#3D2922">Records reveal messages</text>
      <text x="20" y="336" font-size="13" fill="#3D2922">where Liu joked about still</text>
      <text x="20" y="354" font-size="13" fill="#3D2922">having Apple file access.</text>

      <!-- Badge / Summary -->
      <rect x="20" y="430" width="215" height="65" rx="8" fill="#FFFFFF" stroke="#F6D6C8" stroke-width="1.5" />
      <text x="32" y="454" font-size="11" font-weight="700" fill="#B84A28">KEY CLAIM</text>
      <text x="32" y="474" font-size="12" font-weight="600" fill="#421C11">Deliberate spoliation</text>
    </g>

    <!-- CARD 3: OPPOSING POSITIONS -->
    <g transform="translate(606, 150)">
      <rect width="255" height="520" fill="#EBF5ED" rx="14" stroke="#CEE7D2" stroke-width="2" />
      <rect width="255" height="68" fill="#DCEDE0" rx="14" />
      <rect width="255" height="20" y="48" fill="#DCEDE0" />
      
      <!-- Icon Circle -->
      <circle cx="42" cy="34" r="20" fill="#FFFFFF" />
      <path d="m36 38 6-10 6 10M33 38h6M45 38h6" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" />

      <!-- Title -->
      <text x="74" y="34" font-size="16" font-weight="700" fill="#143624" dominant-baseline="central">Opposing Stances</text>

      <!-- Section 1 -->
      <text x="20" y="96" font-size="12" font-weight="700" fill="#2D6A4F">APPLE'S ACCUSATION</text>
      <text x="20" y="118" font-size="13" fill="#1C3024">Claims Liu exploited a rare,</text>
      <text x="20" y="136" font-size="13" fill="#1C3024">unknown authentication flaw</text>
      <text x="20" y="154" font-size="13" fill="#1C3024">to retain illegal access.</text>

      <!-- Section 2 -->
      <text x="20" y="196" font-size="12" font-weight="700" fill="#2D6A4F">OPENAI'S DEFENSE</text>
      <text x="20" y="218" font-size="13" fill="#1C3024">Blames Apple for failing to</text>
      <text x="20" y="236" font-size="13" fill="#1C3024">revoke residual credentials</text>
      <text x="20" y="254" font-size="13" fill="#1C3024">when employees depart.</text>

      <!-- Section 3 -->
      <text x="20" y="296" font-size="12" font-weight="700" fill="#2D6A4F">INTENT &amp; KNOWLEDGE</text>
      <text x="20" y="318" font-size="13" fill="#1C3024">Apple states OpenAI was</text>
      <text x="20" y="336" font-size="13" fill="#1C3024">fully aware of ongoing data</text>
      <text x="20" y="354" font-size="13" fill="#1C3024">access and benefits.</text>

      <!-- Badge / Summary -->
      <rect x="20" y="430" width="215" height="65" rx="8" fill="#FFFFFF" stroke="#CEE7D2" stroke-width="1.5" />
      <text x="32" y="454" font-size="11" font-weight="700" fill="#2D6A4F">CORE CONFLICT</text>
      <text x="32" y="474" font-size="12" font-weight="600" fill="#143624">Exploit vs residual access</text>
    </g>

    <!-- CARD 4: LEGAL REMEDIES -->
    <g transform="translate(885, 150)">
      <rect width="255" height="520" fill="#F3ECF8" rx="14" stroke="#E2D1ED" stroke-width="2" />
      <rect width="255" height="68" fill="#E8DBF0" rx="14" />
      <rect width="255" height="20" y="48" fill="#E8DBF0" />
      
      <!-- Icon Circle -->
      <circle cx="42" cy="34" r="20" fill="#FFFFFF" />
      <path d="M35 29l7-5 7 5M37 38l5-5 5 5" fill="none" stroke="#6B3BA7" stroke-width="2" stroke-linecap="round" />

      <!-- Title -->
      <text x="74" y="34" font-size="16" font-weight="700" fill="#321852" dominant-baseline="central">Legal Injunction</text>

      <!-- Section 1 -->
      <text x="20" y="96" font-size="12" font-weight="700" fill="#6B3BA7">PRELIMINARY INJUNCTION</text>
      <text x="20" y="118" font-size="13" fill="#332442">Apple seeks a court order</text>
      <text x="20" y="136" font-size="13" fill="#332442">halting OpenAI hardware work</text>
      <text x="20" y="154" font-size="13" fill="#332442">based on Apple tech.</text>

      <!-- Section 2 -->
      <text x="20" y="196" font-size="12" font-weight="700" fill="#6B3BA7">EXPEDITED DISCOVERY</text>
      <text x="20" y="218" font-size="13" fill="#332442">Fast-tracked evidentiary</text>
      <text x="20" y="236" font-size="13" fill="#332442">review requested before</text>
      <text x="20" y="254" font-size="13" fill="#332442">more data is compromised.</text>

      <!-- Section 3 -->
      <text x="20" y="296" font-size="12" font-weight="700" fill="#6B3BA7">TALENT MIGRATION</text>
      <text x="20" y="318" font-size="13" fill="#332442">Over 400 former Apple</text>
      <text x="20" y="336" font-size="13" fill="#332442">engineers now work</text>
      <text x="20" y="354" font-size="13" fill="#332442">at OpenAI divisions.</text>

      <!-- Badge / Summary -->
      <rect x="20" y="430" width="215" height="65" rx="8" fill="#FFFFFF" stroke="#E2D1ED" stroke-width="1.5" />
      <text x="32" y="454" font-size="11" font-weight="700" fill="#6B3BA7">OBJECTIVE</text>
      <text x="32" y="474" font-size="12" font-weight="600" fill="#321852">Halt competing hardware</text>
    </g>

    <!-- Footer -->
    <text x="48" y="700" font-size="12" fill="#78827C">Source: Apple Inc. v. OpenAI Court Filings &amp; TechCrunch Reporting</text>
    <text x="1152" y="700" font-size="12" font-weight="600" fill="#78827C" text-anchor="end">Svetni.me Editorial Infographic</text>
  </g>
</svg>
