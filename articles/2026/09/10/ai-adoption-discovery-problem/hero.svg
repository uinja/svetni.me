<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#152038" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="canyonLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="canyonRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- The Open Sky (The Vast Axis of Possibility) -->
  <rect x="0" y="0" width="800" height="260" fill="url(#skyGrad)" />

  <!-- Constellation Mesh / Luminous Possibility Grid in the Sky -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="60" x2="180" y2="90" />
    <line x1="180" y1="90" x2="280" y2="40" />
    <line x1="280" y1="40" x2="400" y2="70" />
    <line x1="400" y1="70" x2="520" y2="30" />
    <line x1="520" y1="30" x2="620" y2="80" />
    <line x1="620" y1="80" x2="720" y2="50" />

    <line x1="180" y1="90" x2="240" y2="150" />
    <line x1="280" y1="40" x2="350" y2="120" />
    <line x1="400" y1="70" x2="400" y2="160" />
    <line x1="520" y1="30" x2="460" y2="120" />
    <line x1="620" y1="80" x2="580" y2="150" />

    <line x1="240" y1="150" x2="350" y2="120" />
    <line x1="350" y1="120" x2="400" y2="160" />
    <line x1="400" y1="160" x2="460" y2="120" />
    <line x1="460" y1="120" x2="580" y2="150" />
  </g>

  <!-- Glowing Nodes of Potential -->
  <g fill="#38bdf8" filter="url(#softGlow)">
    <circle cx="80" cy="60" r="3" />
    <circle cx="180" cy="90" r="4.5" fill="#f472b6" />
    <circle cx="280" cy="40" r="3.5" />
    <circle cx="400" cy="70" r="6" fill="#67e8f9" />
    <circle cx="520" cy="30" r="4" fill="#818cf8" />
    <circle cx="620" cy="80" r="4.5" fill="#f472b6" />
    <circle cx="720" cy="50" r="3" />
    <circle cx="240" cy="150" r="4" />
    <circle cx="350" cy="120" r="5" fill="#a78bfa" />
    <circle cx="400" cy="160" r="5.5" fill="#38bdf8" />
    <circle cx="460" cy="120" r="5" fill="#a78bfa" />
    <circle cx="580" cy="150" r="4" />
  </g>

  <!-- Horizon Line of Pure Light -->
  <line x1="40" y1="180" x2="760" y2="180" stroke="url(#horizonGrad)" stroke-width="2" filter="url(#softGlow)" />

  <!-- Canyon Left Wall: Stratified Geometric Terraces -->
  <path d="M0,180 L220,180 L250,220 L270,280 L310,340 L350,420 L370,500 L0,500 Z" fill="url(#canyonLeft)" />
  <path d="M0,230 L230,230 L260,290 L290,360 L330,450 L345,500 L0,500 Z" fill="#090e1a" opacity="0.6" />
  <path d="M0,290 L210,290 L240,370 L270,470 L275,500 L0,500 Z" fill="#060912" opacity="0.7" />

  <!-- Canyon Right Wall: Stratified Geometric Terraces -->
  <path d="M800,180 L580,180 L550,220 L530,280 L490,340 L450,420 L430,500 L800,500 Z" fill="url(#canyonRight)" />
  <path d="M800,230 L570,230 L540,290 L510,360 L470,450 L455,500 L800,500 Z" fill="#090e1a" opacity="0.6" />
  <path d="M800,290 L590,290 L560,370 L530,470 L525,500 L800,500 Z" fill="#060912" opacity="0.7" />

  <!-- The Canyon Floor & The Narrow Crevice of Perception -->
  <rect x="360" y="470" width="80" height="30" fill="#04060a" />

  <!-- Upward Beam of Revelation (From the narrow slot to the broad sky) -->
  <polygon points="390,480 410,480 470,160 330,160" fill="url(#beamGrad)" opacity="0.6" filter="url(#intenseGlow)" />

  <!-- Rim Vantage Point Platform (Left Rim - The Elevated Observer) -->
  <g transform="translate(200, 150)">
    <ellipse cx="20" cy="30" rx="40" ry="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <circle cx="20" cy="18" r="8" fill="#38bdf8" filter="url(#softGlow)" />
    <!-- Radiating rings of perception / awareness -->
    <circle cx="20" cy="18" r="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="20" cy="18" r="26" fill="none" stroke="#818cf8" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.4" />
  </g>

  <!-- Bottom Ant Perspective (Tiny glowing point deep in the dark chasm) -->
  <g transform="translate(396, 482)">
    <circle cx="4" cy="4" r="3" fill="#f59e0b" filter="url(#softGlow)" />
    <!-- Narrow vertical sightlines reaching upward -->
    <line x1="4" y1="0" x2="4" y2="-40" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.7" />
  </g>

  <!-- Subtle Rim Grid Line Markers -->
  <g opacity="0.2" stroke="#64748b" stroke-width="1">
    <line x1="40" y1="180" x2="220" y2="180" />
    <line x1="580" y1="180" x2="760" y2="180" />
    <line x1="0" y1="350" x2="300" y2="350" />
    <line x1="500" y1="350" x2="800" y2="350" />
  </g>
</svg>
