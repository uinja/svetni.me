<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="hero-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141828"/>
      <stop offset="60%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <!-- Lab 1 (Cyan/Teal - OpenAI trajectory) -->
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Lab 2 (Amber/Coral - Anthropic trajectory) -->
    <linearGradient id="amber-glow" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Horizon Superintelligence Gradient -->
    <radialGradient id="horizon-singularity" cx="50%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Safety Barrier Gradient -->
    <linearGradient id="barrier-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="1600" height="1000" fill="url(#hero-bg)"/>

  <!-- 2. Perspective Convergence Grid -->
  <g opacity="0.18">
    <line x1="800" y1="150" x2="-200" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="150" x2="100" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="150" x2="400" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="150" x2="650" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    
    <line x1="800" y1="150" x2="950" y2="1000" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="800" y1="150" x2="1200" y2="1000" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="800" y1="150" x2="1500" y2="1000" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="800" y1="150" x2="1800" y2="1000" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Horizontal Trajectory Iso-lines -->
    <line x1="100" y1="900" x2="1500" y2="900" stroke="#64748B" stroke-width="1"/>
    <line x1="250" y1="750" x2="1350" y2="750" stroke="#64748B" stroke-width="1"/>
    <line x1="420" y1="600" x2="1180" y2="600" stroke="#64748B" stroke-width="1"/>
    <line x1="560" y1="450" x2="1040" y2="450" stroke="#64748B" stroke-width="1"/>
    <line x1="680" y1="300" x2="920" y2="300" stroke="#64748B" stroke-width="1"/>
  </g>

  <!-- 3. Upper Singularity Horizon (Superintelligence Target) -->
  <circle cx="800" cy="150" r="260" fill="url(#horizon-singularity)"/>
  <ellipse cx="800" cy="150" rx="140" ry="25" fill="#C7D2FE" opacity="0.6" filter="url(#glow-intense)"/>
  <circle cx="800" cy="150" r="8" fill="#FFFFFF" filter="url(#glow-light)"/>

  <!-- 4. Left Lab Stream: OpenAI Paradigm (Teal/Cyan Dynamic Cluster) -->
  <g filter="url(#glow-light)">
    <!-- Main Acceleration Rail -->
    <path d="M 220 880 C 340 780, 520 620, 740 220" fill="none" stroke="url(#cyan-glow)" stroke-width="5"/>
    <path d="M 120 950 C 260 840, 460 660, 720 250" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="12 6" opacity="0.7"/>
    <path d="M 320 820 C 440 700, 600 500, 760 190" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.8"/>

    <!-- Neural Pre-training Nodes -->
    <circle cx="220" cy="880" r="16" fill="#0C4A6E" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="220" cy="880" r="6" fill="#BAE6FD"/>

    <circle cx="340" cy="770" r="12" fill="#0369A1" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="340" cy="770" r="4" fill="#FFFFFF"/>

    <circle cx="460" cy="640" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="460" cy="640" r="5" fill="#FFFFFF"/>

    <circle cx="580" cy="480" r="10" fill="#06B6D4" stroke="#E0F2FE" stroke-width="2"/>
    <circle cx="680" cy="320" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="740" cy="220" r="6" fill="#FFFFFF"/>
  </g>

  <!-- 5. Right Lab Stream: Anthropic Paradigm (Amber/Coral Dynamic Cluster) -->
  <g filter="url(#glow-light)">
    <!-- Main Acceleration Rail -->
    <path d="M 1380 880 C 1260 780, 1080 620, 860 220" fill="none" stroke="url(#amber-glow)" stroke-width="5"/>
    <path d="M 1480 950 C 1340 840, 1140 660, 880 250" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="12 6" opacity="0.7"/>
    <path d="M 1280 820 C 1160 700, 1000 500, 840 190" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.8"/>

    <!-- Neural Pre-training Nodes -->
    <circle cx="1380" cy="880" r="16" fill="#78350F" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="1380" cy="880" r="6" fill="#FEF3C7"/>

    <circle cx="1260" cy="770" r="12" fill="#B45309" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="1260" cy="770" r="4" fill="#FFFFFF"/>

    <circle cx="1140" cy="640" r="14" fill="#D97706" stroke="#FBBF24" stroke-width="3"/>
    <circle cx="1140" cy="640" r="5" fill="#FFFFFF"/>

    <circle cx="1020" cy="480" r="10" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2"/>
    <circle cx="920" cy="320" r="8" fill="#FB7185" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="860" cy="220" r="6" fill="#FFFFFF"/>
  </g>

  <!-- 6. Interconnecting Cross-Lab Transfers & Competitive Tension -->
  <g opacity="0.45">
    <line x1="340" y1="770" x2="1260" y2="770" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="460" y1="640" x2="1140" y2="640" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="580" y1="480" x2="1020" y2="480" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="680" y1="320" x2="920" y2="320" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- 7. Central Critical Safety Threshold / Fractured Barrier -->
  <g filter="url(#glow-light)">
    <!-- Central Alignment Axis -->
    <line x1="800" y1="960" x2="800" y2="300" stroke="url(#barrier-grad)" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Fractured Safety Shield Diamond -->
    <polygon points="800,440 860,530 800,620 740,530" fill="#1E1B2E" stroke="#EF4444" stroke-width="3" opacity="0.9"/>
    <polygon points="800,460 840,530 800,600 760,530" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.8"/>

    <!-- Fracture lines through shield (Signaling resignation & containment breach) -->
    <path d="M 780 470 L 810 520 L 790 550 L 825 590" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="810" cy="520" r="4" fill="#EF4444" filter="url(#glow-intense)"/>

    <!-- Perimeter Hazard Marker Nodes -->
    <polygon points="800,280 812,300 788,300" fill="#EF4444"/>
    <polygon points="800,660 812,680 788,680" fill="#F59E0B"/>
    <circle cx="800" cy="760" r="7" fill="#EF4444" stroke="#FEE2E2" stroke-width="2"/>
    <circle cx="800" cy="860" r="5" fill="#EF4444" opacity="0.7"/>
  </g>

  <!-- 8. Subtle Foreground Geometric Accents (Zero Alphanumeric Glyphs) -->
  <g opacity="0.3">
    <!-- Abstract Hexagon Cluster (Left) -->
    <polygon points="280,480 320,460 360,480 360,520 320,540 280,520" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <polygon points="230,510 270,490 310,510 310,550 270,570 230,550" fill="none" stroke="#0284C7" stroke-width="1"/>

    <!-- Abstract Hexagon Cluster (Right) -->
    <polygon points="1240,480 1280,460 1320,480 1320,520 1280,540 1240,520" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <polygon points="1290,510 1330,490 1370,510 1370,550 1330,570 1290,550" fill="none" stroke="#D97706" stroke-width="1"/>
  </g>
</svg>
