<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="40%" stop-color="#0D1527"/>
      <stop offset="75%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#1B2D4A"/>
    </linearGradient>

    <!-- Glowing Horizon / Sun Arc -->
    <radialGradient id="horizonGlow" cx="50%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#1E3A8A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070A14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sphereGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#164E63"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="90%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <!-- Glass & Building Gradients -->
    <linearGradient id="bldgGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="bldgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sharpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>
  <rect width="1600" height="1000" fill="url(#horizonGlow)"/>

  <!-- Celestial & Constellation Grid Elements -->
  <g opacity="0.25">
    <circle cx="800" cy="520" r="420" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="800" cy="520" r="620" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 12"/>
    <circle cx="800" cy="520" r="820" fill="none" stroke="#60A5FA" stroke-width="0.75" stroke-dasharray="8 16"/>
  </g>

  <!-- Distant Mountains & Steppe Landscape Silhouette -->
  <path d="M0 680 Q250 630 500 660 T1000 650 T1600 670 L1600 760 L0 760 Z" fill="#0E1626" opacity="0.6"/>
  <path d="M0 700 Q350 670 700 690 T1400 680 T1600 710 L1600 780 L0 780 Z" fill="#111B30" opacity="0.8"/>

  <!-- Perspective Ground Tech Grid -->
  <g opacity="0.18">
    <line x1="800" y1="670" x2="-200" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="100" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="400" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="650" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="950" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="1200" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="1500" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="800" y1="670" x2="1800" y2="1000" stroke="#38BDF8" stroke-width="1.5"/>

    <line x1="200" y1="720" x2="1400" y2="720" stroke="#38BDF8" stroke-width="1"/>
    <line x1="100" y1="755" x2="1500" y2="755" stroke="#38BDF8" stroke-width="1"/>
    <line x1="0" y1="800" x2="1600" y2="800" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="-100" y1="860" x2="1700" y2="860" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Futuristic Astana City Skyline (Background Silhouettes) -->
  <!-- Left Cluster Buildings -->
  <rect x="180" y="440" width="70" height="260" rx="3" fill="#131E35"/>
  <rect x="230" y="480" width="55" height="220" rx="3" fill="#16233E"/>
  <rect x="120" y="520" width="80" height="180" rx="3" fill="#0F172A"/>
  <polygon points="215,380 180,440 250,440" fill="#1E293B"/>

  <!-- Left Futuristic Canopy (Khan Shatyr Tent Silhouette) -->
  <path d="M320 690 L420 410 L520 690 Z" fill="url(#glassFacet)" opacity="0.45"/>
  <path d="M370 690 L420 410 L470 690 Z" fill="#38BDF8" opacity="0.3"/>
  <line x1="420" y1="410" x2="420" y2="690" stroke="#00F2FE" stroke-width="2" opacity="0.7"/>
  <line x1="320" y1="690" x2="420" y2="410" stroke="#38BDF8" stroke-width="1.5" opacity="0.8"/>
  <line x1="520" y1="690" x2="420" y2="410" stroke="#38BDF8" stroke-width="1.5" opacity="0.8"/>

  <!-- Right Cluster Towers -->
  <rect x="1150" y="410" width="85" height="290" rx="4" fill="#131E35"/>
  <rect x="1215" y="460" width="75" height="240" rx="4" fill="#172440"/>
  <rect x="1310" y="490" width="90" height="210" rx="4" fill="#0F172A"/>
  <polygon points="1192,340 1150,410 1235,410" fill="#1E293B"/>

  <!-- Right Curved Architectural Pavilion -->
  <path d="M1020 690 Q1100 500 1180 690 Z" fill="url(#glassFacet)" opacity="0.4"/>
  <path d="M1040 690 Q1100 530 1160 690 Z" fill="#0284C7" opacity="0.3"/>

  <!-- Central Monument: Modern Futuristic Baiterek & Nur Alem Fusion -->
  <!-- Base Support Pedestal & Columns -->
  <path d="M720 680 L760 480 L790 480 L760 680 Z" fill="url(#bldgGrad1)"/>
  <path d="M880 680 L840 480 L810 480 L840 680 Z" fill="url(#bldgGrad1)"/>
  <line x1="775" y1="480" x2="775" y2="680" stroke="#00F2FE" stroke-width="2" opacity="0.6"/>
  <line x1="825" y1="480" x2="825" y2="680" stroke="#00F2FE" stroke-width="2" opacity="0.6"/>

  <!-- Outer Kinetic Lattice Prongs Surrounding Sphere -->
  <path d="M710 520 Q700 370 760 300 L775 315 Q725 380 735 520 Z" fill="url(#glassFacet)"/>
  <path d="M890 520 Q900 370 840 300 L825 315 Q875 380 865 520 Z" fill="url(#glassFacet)"/>
  <path d="M680 540 Q660 400 730 330 L740 345 Q685 410 705 540 Z" fill="#38BDF8" opacity="0.4"/>
  <path d="M920 540 Q940 400 870 330 L860 345 Q915 410 895 540 Z" fill="#38BDF8" opacity="0.4"/>

  <!-- Golden Radiant Spherical Core (The Baiterek Sun Sphere / Nur Alem Sphere) -->
  <circle cx="800" cy="360" r="110" fill="url(#horizonGlow)" filter="url(#softGlow)"/>
  <circle cx="800" cy="360" r="80" fill="url(#goldGlow)" filter="url(#sharpGlow)"/>
  <circle cx="800" cy="360" r="80" fill="url(#sphereGlow)" opacity="0.25"/>

  <!-- Geometric Latitude/Longitude Lines on Sphere -->
  <ellipse cx="800" cy="360" rx="80" ry="28" fill="none" stroke="#FEF3C7" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="800" cy="360" rx="80" ry="56" fill="none" stroke="#FEF3C7" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="800" cy="360" rx="40" ry="80" fill="none" stroke="#FEF3C7" stroke-width="1.2" opacity="0.6"/>
  <line x1="800" y1="280" x2="800" y2="440" stroke="#FEF3C7" stroke-width="1.5" opacity="0.7"/>

  <!-- Spire Beacon Laser -->
  <line x1="800" y1="280" x2="800" y2="80" stroke="#67E8F9" stroke-width="2" filter="url(#sharpGlow)"/>
  <circle cx="800" cy="80" r="5" fill="#FFFFFF" filter="url(#softGlow)"/>

  <!-- Interconnected Data Network Constellation -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.75">
    <line x1="420" y1="410" x2="560" y2="340"/>
    <line x1="560" y1="340" x2="720" y2="360"/>
    <line x1="720" y1="360" x2="800" y2="360"/>
    <line x1="800" y1="360" x2="980" y2="320"/>
    <line x1="980" y1="320" x2="1100" y2="440"/>
    <line x1="560" y1="340" x2="630" y2="490"/>
    <line x1="980" y1="320" x2="950" y2="470"/>
    <line x1="630" y1="490" x2="775" y2="480"/>
    <line x1="950" y1="470" x2="825" y2="480"/>
    <line x1="420" y1="410" x2="300" y2="470"/>
    <line x1="1100" y1="440" x2="1240" y2="420"/>
  </g>

  <!-- Network Glowing Nodes -->
  <g filter="url(#sharpGlow)">
    <circle cx="560" cy="340" r="7" fill="#00F2FE"/>
    <circle cx="980" cy="320" r="7" fill="#00F2FE"/>
    <circle cx="630" cy="490" r="6" fill="#F59E0B"/>
    <circle cx="950" cy="470" r="6" fill="#F59E0B"/>
    <circle cx="420" cy="410" r="6" fill="#38BDF8"/>
    <circle cx="1100" cy="440" r="6" fill="#38BDF8"/>
    <circle cx="300" cy="470" r="5" fill="#10B981"/>
    <circle cx="1240" cy="420" r="5" fill="#10B981"/>
  </g>

  <!-- Midground Illuminated Windows & Tech Hub Facades -->
  <g fill="#FDE68A" opacity="0.65">
    <!-- Building 1 windows -->
    <rect x="195" y="460" width="5" height="8" rx="1"/>
    <rect x="208" y="460" width="5" height="8" rx="1"/>
    <rect x="221" y="460" width="5" height="8" rx="1"/>
    <rect x="195" y="480" width="5" height="8" rx="1"/>
    <rect x="208" y="480" width="5" height="8" rx="1"/>
    <rect x="221" y="480" width="5" height="8" rx="1"/>
    <rect x="195" y="510" width="5" height="8" rx="1"/>
    <rect x="208" y="510" width="5" height="8" rx="1"/>
    <rect x="221" y="510" width="5" height="8" rx="1"/>
    <!-- Building 2 windows -->
    <rect x="1170" y="440" width="6" height="10" rx="1"/>
    <rect x="1185" y="440" width="6" height="10" rx="1"/>
    <rect x="1200" y="440" width="6" height="10" rx="1"/>
    <rect x="1170" y="470" width="6" height="10" rx="1"/>
    <rect x="1185" y="470" width="6" height="10" rx="1"/>
    <rect x="1200" y="470" width="6" height="10" rx="1"/>
    <rect x="1170" y="510" width="6" height="10" rx="1"/>
    <rect x="1185" y="510" width="6" height="10" rx="1"/>
    <rect x="1200" y="510" width="6" height="10" rx="1"/>
  </g>

  <!-- Foreground: Modern Futuristic Observation Terrace / Co-working Deck -->
  <polygon points="0,850 480,780 1120,780 1600,850 1600,1000 0,1000" fill="url(#terraceGrad)"/>
  <line x1="0" y1="850" x2="480" y2="780" stroke="#38BDF8" stroke-width="3" opacity="0.7"/>
  <line x1="480" y1="780" x2="1120" y2="780" stroke="#00F2FE" stroke-width="3.5" filter="url(#sharpGlow)"/>
  <line x1="1120" y1="780" x2="1600" y2="850" stroke="#38BDF8" stroke-width="3" opacity="0.7"/>

  <!-- Glass Balustrade on Terrace -->
  <polygon points="450,780 1150,780 1150,720 450,720" fill="url(#glassFacet)" opacity="0.35"/>
  <line x1="450" y1="720" x2="1150" y2="720" stroke="#67E8F9" stroke-width="2" opacity="0.8"/>
  <line x1="550" y1="720" x2="550" y2="780" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
  <line x1="700" y1="720" x2="700" y2="780" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
  <line x1="800" y1="720" x2="800" y2="780" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
  <line x1="900" y1="720" x2="900" y2="780" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
  <line x1="1050" y1="720" x2="1050" y2="780" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>

  <!-- Digital Nomad Workstation (Silhouettes: Desk, Laptop, Coffee, Subtle Seated Tech Founder) -->
  <!-- Center-Right Workstation -->
  <g opacity="0.95">
    <!-- Sleek Minimalist Desk -->
    <rect x="910" y="800" width="180" height="12" rx="4" fill="#334155"/>
    <line x1="930" y1="812" x2="920" y2="920" stroke="#1E293B" stroke-width="6"/>
    <line x1="1070" y1="812" x2="1080" y2="920" stroke="#1E293B" stroke-width="6"/>

    <!-- Glowing Laptop Open on Desk -->
    <polygon points="965,800 1025,800 1035,760 975,760" fill="#F8FAFC" filter="url(#sharpGlow)"/>
    <polygon points="960,800 1030,800 1038,758 970,758" fill="#00F2FE" opacity="0.4"/>
    <rect x="955" y="798" width="80" height="4" rx="2" fill="#64748B"/>

    <!-- Ambient Screen Light Cone -->
    <polygon points="975,760 1035,760 1065,710 945,710" fill="#38BDF8" opacity="0.12"/>

    <!-- Coffee Mug -->
    <rect x="1050" y="790" width="14" height="12" rx="2" fill="#E2E8F0"/>
    <path d="M1064 792 Q1070 796 1064 800" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Left Workstation Lounge Seat & Nomad Figure Silhouette -->
  <g opacity="0.9">
    <!-- Minimalist Modern Lounge Chair -->
    <path d="M570 870 L600 810 Q610 790 630 790 L650 790 L635 870 Z" fill="#1E293B"/>
    <!-- Seated Founder Silhouette Viewing the Futuristic Horizon -->
    <circle cx="620" cy="740" r="16" fill="#0F172A"/>
    <path d="M595 810 C600 765 635 765 645 810 L635 860 L605 860 Z" fill="#0F172A"/>
    <!-- Tablet / Device in Hands Glowing -->
    <polygon points="635,790 660,785 665,805 640,810" fill="#38BDF8" filter="url(#sharpGlow)"/>
  </g>

  <!-- Foreground Subtle Floating Data Particles & Sparkles -->
  <g filter="url(#softGlow)" fill="#67E8F9" opacity="0.7">
    <circle cx="280" cy="880" r="3"/>
    <circle cx="420" cy="830" r="2"/>
    <circle cx="780" cy="850" r="3"/>
    <circle cx="1200" cy="820" r="2.5"/>
    <circle cx="1380" cy="890" r="3"/>
    <circle cx="850" cy="740" r="2"/>
  </g>
</svg>
