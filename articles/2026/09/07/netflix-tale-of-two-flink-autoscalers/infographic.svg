<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <!-- Background Canvas: Warm Cream -->
  <rect width="1280" height="720" fill="#fcf9f2" />

  <!-- Subtle Header Border & Glow -->
  <rect x="40" y="32" width="1200" height="96" rx="16" fill="#ffffff" stroke="#e2d9cc" stroke-width="1.5" />
  
  <!-- Main Title -->
  <text x="72" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#0f172a">NETFLIX: A TALE OF TWO FLINK AUTOSCALERS</text>
  <!-- Subtitle -->
  <text x="72" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#475569">Architectural transition from cluster-level external telemetry to vertex-level True Processing Rate (TPR)</text>

  <!-- COLUMN 1: Internal Autoscaler (Past) -->
  <g transform="translate(40, 144)">
    <!-- Column Card -->
    <rect width="384" height="448" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Header Banner -->
    <rect width="384" height="68" rx="16" fill="#f1f5f9" />
    <rect y="52" width="384" height="16" fill="#f1f5f9" />
    <!-- Badge -->
    <rect x="24" y="16" width="104" height="24" rx="12" fill="#e2e8f0" />
    <text x="76" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">MANTIS + ATLAS</text>
    <!-- Column Title -->
    <text x="24" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">1. Internal Autoscaler (2019)</text>

    <!-- Point 1 -->
    <circle cx="36" cy="100" r="4" fill="#64748b" />
    <text x="52" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">External Telemetry</text>
    <text x="52" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">Consumed CPU, network, and Kafka lag</text>
    <text x="52" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">pushed from Atlas monitoring feeds.</text>

    <!-- Point 2 -->
    <circle cx="36" cy="170" r="4" fill="#64748b" />
    <text x="52" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Coarse Cluster Scaling</text>
    <text x="52" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">Adjusted total TaskManager count;</text>
    <text x="52" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">all operators shared the same decision.</text>

    <!-- Point 3 -->
    <circle cx="36" cy="240" r="4" fill="#64748b" />
    <text x="52" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Proven Initial Impact</text>
    <text x="52" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">Cut 25%–45% compute resources across</text>
    <text x="52" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#475569">thousands of simple stream pipelines.</text>

    <!-- Bottleneck Box -->
    <rect x="20" y="316" width="344" height="112" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" />
    <text x="36" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b">THE OPERATIONAL CEILING</text>
    <text x="36" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#7f1d1d">• Blind to operator-level bottlenecks in DAGs</text>
    <text x="36" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#7f1d1d">• Unsuitable for complex stateful joins/branches</text>
    <text x="36" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#7f1d1d">• External metrics missed hidden task saturation</text>
  </g>

  <!-- COLUMN 2: OSS Flink Autoscaler (Algorithm) -->
  <g transform="translate(448, 144)">
    <!-- Column Card -->
    <rect width="384" height="448" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <!-- Header Banner -->
    <rect width="384" height="68" rx="16" fill="#dcfce7" />
    <rect y="52" width="384" height="16" fill="#dcfce7" />
    <!-- Badge -->
    <rect x="24" y="16" width="112" height="24" rx="12" fill="#bbf7d0" />
    <text x="80" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">FLIP-271 &amp; DS2</text>
    <!-- Column Title -->
    <text x="24" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2. OSS Flink Autoscaler</text>

    <!-- Point 1 -->
    <circle cx="36" cy="100" r="4" fill="#15803d" />
    <text x="52" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#14532d">Reasoning From Inside</text>
    <text x="52" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#166534">Pulls runtime metrics directly from the</text>
    <text x="52" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#166534">JobManager REST API for each subtask.</text>

    <!-- Formula Highlight Box -->
    <rect x="20" y="156" width="344" height="64" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="36" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">TRUE PROCESSING RATE (TPR)</text>
    <text x="36" y="202" font-family="monospace" font-size="13" font-weight="700" fill="#047857">TPR = Throughput / Busy_Fraction</text>

    <!-- Point 2 -->
    <circle cx="36" cy="246" r="4" fill="#15803d" />
    <text x="52" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#14532d">Per-Vertex Parallelism</text>
    <text x="52" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#166534">Walks the DAG and computes precise</text>
    <text x="52" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#166534">parallelism for individual vertices.</text>

    <!-- Value Box -->
    <rect x="20" y="316" width="344" height="112" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5" />
    <text x="36" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#14532d">STATEFUL DAG CAPABILITY</text>
    <text x="36" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#166534">• Scales multi-operator stateful pipelines</text>
    <text x="36" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#166534">• Granular per-job overrides &amp; profiles</text>
    <text x="36" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#166534">• Eliminates manual tuning for custom jobs</text>
  </g>

  <!-- COLUMN 3: Netflix Scale Hardening -->
  <g transform="translate(856, 144)">
    <!-- Column Card -->
    <rect width="384" height="448" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <!-- Header Banner -->
    <rect width="384" height="68" rx="16" fill="#dbeafe" />
    <rect y="52" width="384" height="16" fill="#dbeafe" />
    <!-- Badge -->
    <rect x="24" y="16" width="136" height="24" rx="12" fill="#bfdbfe" />
    <text x="92" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">TEMPORAL ENGINE</text>
    <!-- Column Title -->
    <text x="24" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">3. Netflix Scale Additions</text>

    <!-- Point 1 -->
    <circle cx="36" cy="100" r="4" fill="#2563eb" />
    <text x="52" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Isolated Workflows</text>
    <text x="52" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1e40af">Spring Boot + Temporal runs 1 workflow</text>
    <text x="52" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1e40af">per job; eliminates noisy neighbor failures.</text>

    <!-- Point 2 -->
    <circle cx="36" cy="170" r="4" fill="#2563eb" />
    <text x="52" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">High Parallelism Telemetry</text>
    <text x="52" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1e40af">Server-side metric filtering &amp; caching</text>
    <text x="52" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1e40af">scaled support from 1,000 to 3,000 subtasks.</text>

    <!-- Point 3 -->
    <circle cx="36" cy="240" r="4" fill="#2563eb" />
    <text x="52" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Graph &amp; Sink Safety</text>
    <text x="52" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1e40af">Preserves forward in-memory chaining;</text>
    <text x="52" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1e40af">prevents scaling up into saturated sinks.</text>

    <!-- Result Box -->
    <rect x="20" y="316" width="344" height="112" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
    <text x="36" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">PRODUCTION OUTCOMES</text>
    <text x="36" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#1e40af">• 58% Flink compute reduction in logging</text>
    <text x="36" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#1e40af">• ~$1.1 Million saved annually per team</text>
    <text x="36" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#1e40af">• Target utilization 0.45 avoids thrashing</text>
  </g>

  <!-- BOTTOM STATS / TAKEAWAYS BAR -->
  <g transform="translate(40, 612)">
    <rect width="1200" height="76" rx="14" fill="#ffffff" stroke="#e2d9cc" stroke-width="1.5" />
    
    <!-- Item 1 -->
    <text x="36" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b">SCALE</text>
    <text x="36" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">30,000+ Flink Jobs</text>
    
    <line x1="280" y1="18" x2="280" y2="58" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Item 2 -->
    <text x="312" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b">EFFICIENCY</text>
    <text x="312" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">0.45 Utilization Target</text>

    <line x1="600" y1="18" x2="600" y2="58" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Item 3 -->
    <text x="632" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b">UPSTREAM CONTRIBUTION</text>
    <text x="632" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">FLINK-36172 &amp; REST Filters</text>

    <line x1="940" y1="18" x2="940" y2="58" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Item 4 -->
    <text x="972" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748b">FUTURE ROADMAP</text>
    <text x="972" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Flink 2 Disaggregated State</text>
  </g>
</svg>