<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180c1e" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#ff3d47" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="250" r="160" fill="url(#glowRed)" />
  <circle cx="580" cy="240" r="180" fill="url(#glowCyan)" />

  <!-- Technical Grid Mesh -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="240" y1="0" x2="240" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="560" y1="0" x2="560" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Flowing Stream Data Paths -->
  <g fill="none" stroke-linecap="round">
    <!-- Stream Source to Split -->
    <path d="M 60 250 C 120 250, 140 180, 220 180 S 300 220, 360 220" stroke="url(#redGrad)" stroke-width="3" stroke-opacity="0.8" />
    <path d="M 60 250 C 120 250, 140 320, 220 320 S 300 280, 360 280" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.8" />

    <!-- Branching & Joining Stateful DAG Pipes -->
    <path d="M 360 220 C 420 220, 440 140, 520 140 S 600 180, 680 180" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.7" />
    <path d="M 360 220 C 440 220, 480 250, 560 250 S 640 250, 740 250" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-opacity="0.9" />
    <path d="M 360 280 C 420 280, 440 360, 520 360 S 600 320, 680 320" stroke="url(#redGrad)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.7" />

    <!-- Cross Connectors / Join Edges -->
    <path d="M 520 140 C 540 190, 540 210, 560 250" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M 520 360 C 540 310, 540 290, 560 250" stroke="#ff3d47" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Autoscaling Elastic Bounding Brackets (Operator Clusters) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Source Cluster Enclosure -->
    <rect x="180" y="140" width="80" height="220" rx="12" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6" />
    <!-- Core Transformation Cluster -->
    <rect x="320" y="170" width="80" height="160" rx="12" stroke="#e50914" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 6" />
    <!-- Scaled Parallel Vertices Enclosure -->
    <rect x="480" y="100" width="80" height="300" rx="16" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6" />
  </g>

  <!-- Data Flow Nodes / Flink Task Vertices -->
  <!-- Source Nodes -->
  <circle cx="60" cy="250" r="14" fill="#0f172a" stroke="#e50914" stroke-width="3" />
  <circle cx="60" cy="250" r="6" fill="#e50914" />

  <!-- Pre-processing Operator Nodes -->
  <g fill="#0f172a" stroke-width="2.5">
    <circle cx="220" cy="180" r="12" stroke="#ff3d47" />
    <circle cx="220" cy="180" r="5" fill="#ff3d47" />

    <circle cx="220" cy="320" r="12" stroke="#00e5ff" />
    <circle cx="220" cy="320" r="5" fill="#00e5ff" />
  </g>

  <!-- Central Stateful Joiner Nodes -->
  <g fill="#1e1b4b" stroke-width="3">
    <rect x="344" y="204" width="32" height="32" rx="8" stroke="#a855f7" />
    <circle cx="360" cy="220" r="6" fill="#a855f7" />

    <rect x="344" y="264" width="32" height="32" rx="8" stroke="#e50914" />
    <circle cx="360" cy="280" r="6" fill="#e50914" />
  </g>

  <!-- Scaled Operator Vertices (Parallelism = 4) -->
  <g fill="#0f172a" stroke-width="2.5">
    <!-- Vertex 1 -->
    <circle cx="520" cy="140" r="13" stroke="#a855f7" />
    <circle cx="520" cy="140" r="5" fill="#a855f7" />
    <!-- Vertex 2 (Scaled Up) -->
    <circle cx="560" cy="215" r="13" stroke="#00e5ff" />
    <circle cx="560" cy="215" r="5" fill="#00e5ff" />
    <!-- Vertex 3 (Scaled Up) -->
    <circle cx="560" cy="285" r="13" stroke="#00e5ff" />
    <circle cx="560" cy="285" r="5" fill="#00e5ff" />
    <!-- Vertex 4 -->
    <circle cx="520" cy="360" r="13" stroke="#ff3d47" />
    <circle cx="520" cy="360" r="5" fill="#ff3d47" />
  </g>

  <!-- Aggregated Sink Nodes -->
  <g fill="#0f172a" stroke-width="3">
    <circle cx="680" cy="180" r="14" stroke="#a855f7" />
    <circle cx="680" cy="180" r="6" fill="#a855f7" />

    <circle cx="740" cy="250" r="16" stroke="#00e5ff" />
    <circle cx="740" cy="250" r="7" fill="#00e5ff" />

    <circle cx="680" cy="320" r="14" stroke="#e50914" />
    <circle cx="680" cy="320" r="6" fill="#e50914" />
  </g>

  <!-- Subtle Metric Telemetry Pulses -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="140" cy="215" r="2.5" />
    <circle cx="290" cy="250" r="3" />
    <circle cx="450" cy="180" r="2.5" />
    <circle cx="450" cy="320" r="2.5" />
    <circle cx="630" cy="250" r="3.5" />
  </g>
</svg>