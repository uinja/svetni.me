<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <style id="dynamic-palette">
    :root {
      --color-primary: #1a30ae;
      --color-secondary: #1b31ae;
      --color-tertiary: #1e33af;
      --color-background: #ffffff;
      --color-surface: #f8f9fa;
      --color-on-primary: #ffffff;
      --color-on-surface: #202124;
    }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111c35" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />

  <!-- Background Ambient Glows -->
  <circle cx="400" cy="250" r="180" fill="#06b6d4" opacity="0.08" filter="url(#glow-filter)" />
  <circle cx="400" cy="250" r="100" fill="#10b981" opacity="0.12" filter="url(#glow-filter)" />
  <circle cx="220" cy="180" r="90" fill="#6366f1" opacity="0.07" filter="url(#glow-filter)" />
  <circle cx="580" cy="320" r="100" fill="#10b981" opacity="0.07" filter="url(#glow-filter)" />

  <!-- Subtle Perspective Grid Lines -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Concentric Orbital Geometries (Alien Mind Core) -->
  <g transform="translate(400, 250)">
    <!-- Outer Orbital Rings -->
    <ellipse rx="220" ry="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25" stroke-dasharray="6,8" transform="rotate(-20)" />
    <ellipse rx="220" ry="110" fill="none" stroke="#10b981" stroke-width="1" opacity="0.25" stroke-dasharray="6,8" transform="rotate(25)" />
    <ellipse rx="180" ry="75" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.35" transform="rotate(-60)" />
    <circle r="140" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,6" />

    <!-- Autonomous Agent Pipeline Nodes & Branching Nodes -->
    <!-- Node Left-Up -->
    <g transform="translate(-180, -90)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle r="6" fill="#38bdf8" />
      <line x1="24" y1="12" x2="70" y2="35" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Node Right-Up -->
    <g transform="translate(190, -80)">
      <rect x="-26" y="-26" width="52" height="52" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <polygon points="0,-8 7,6 -7,6" fill="#10b981" />
      <line x1="-26" y1="15" x2="-80" y2="40" stroke="#10b981" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Node Left-Down -->
    <g transform="translate(-190, 85)">
      <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#818cf8" />
      <line x1="22" y1="-10" x2="80" y2="-35" stroke="#6366f1" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Node Right-Down -->
    <g transform="translate(180, 95)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <circle r="7" fill="#06b6d4" />
      <line x1="-24" y1="-12" x2="-70" y2="-40" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Direct Inter-Agent Data Highways -->
    <path d="M-110,-45 Q0,-90 110,-40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-dasharray="5,5" />
    <path d="M-110,45 Q0,90 110,45" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" stroke-dasharray="5,5" />
    <path d="M-50,-110 Q-90,0 -50,110" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
    <path d="M50,-110 Q90,0 50,110" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4" />

    <!-- Central Alien Intelligence Octagon & Core -->
    <polygon points="0,-72 51,-51 72,0 51,51 0,72 -51,51 -72,0 -51,-51" fill="#0f172a" stroke="url(#core-glow)" stroke-width="3" />
    <polygon points="0,-52 37,-37 52,0 37,37 0,52 -37,37 -52,0 -37,-37" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />

    <!-- Recursive Self-Improvement Inner Core -->
    <circle r="26" fill="url(#core-glow)" opacity="0.9" />
    <circle r="16" fill="#0f172a" />
    <circle r="7" fill="#ffffff" opacity="0.95" />

    <!-- Emanating Neural Radiations -->
    <line x1="0" y1="-72" x2="0" y2="-120" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="51" y1="-51" x2="85" y2="-85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="72" y1="0" x2="120" y2="0" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="51" y1="51" x2="85" y2="85" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="0" y1="72" x2="0" y2="120" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="-51" y1="51" x2="-85" y2="85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="-72" y1="0" x2="-120" y2="0" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="-51" y1="-51" x2="-85" y2="-85" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Satellite Research Micro-Agents -->
    <circle cx="-85" cy="-85" r="4" fill="#38bdf8" />
    <circle cx="85" cy="-85" r="4" fill="#10b981" />
    <circle cx="120" cy="0" r="4" fill="#06b6d4" />
    <circle cx="85" cy="85" r="4" fill="#818cf8" />
    <circle cx="-85" cy="85" r="4" fill="#38bdf8" />
    <circle cx="-120" cy="0" r="4" fill="#06b6d4" />
    <circle cx="0" cy="-120" r="4" fill="#10b981" />
    <circle cx="0" cy="120" r="4" fill="#10b981" />
  </g>

  <!-- Foreground Framing Brackets (Minimalist Tech HUD) -->
  <path d="M 40 40 L 80 40 M 40 40 L 40 80" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
  <path d="M 760 40 L 720 40 M 760 40 L 760 80" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
  <path d="M 40 460 L 80 460 M 40 460 L 40 420" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
  <path d="M 760 460 L 720 460 M 760 460 L 760 420" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />
</svg>
